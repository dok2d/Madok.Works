<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__APP_NAME__ — Вход</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--bg2:#181a24;--bg3:#1e2030;--bg4:#262840;--fg:#c8cad8;--fg2:#8b8fa8;--fg3:#5c6078;--accent:#7c6ff7;--accent2:#a78bfa;--red:#ef4444;--radius:6px;--radius-lg:10px}
html{font-size:18px}
body{font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:var(--bg2);border-radius:var(--radius-lg);padding:40px;width:380px;max-width:95vw;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.login-card h1{font-size:1.4rem;text-align:center;margin-bottom:8px;color:var(--accent2);font-family:'JetBrains Mono',monospace;letter-spacing:-.02em}
.login-card .subtitle{text-align:center;color:var(--fg3);font-size:.85rem;margin-bottom:28px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.field label{font-size:.8rem;color:var(--fg2);font-weight:600}
.field input{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:10px 12px;color:var(--fg);font-family:inherit;font-size:.9rem;outline:none;transition:border .15s}
.field input:focus{border-color:var(--accent)}
.btn{display:block;width:100%;padding:10px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.9rem;font-family:inherit;font-weight:600;transition:all .15s;background:var(--accent);color:#fff;margin-top:8px}
.btn:hover{background:var(--accent2)}
.error{color:var(--red);font-size:.82rem;text-align:center;margin-top:12px;min-height:1.2em}
.setup-note{text-align:center;color:var(--fg3);font-size:.78rem;margin-top:16px}
.sso-divider{display:flex;align-items:center;gap:12px;margin:20px 0 12px;color:var(--fg3);font-size:.78rem}
.sso-divider::before,.sso-divider::after{content:'';flex:1;height:1px;background:var(--bg4)}
.btn-sso{display:block;width:100%;padding:10px;border:1px solid var(--bg4);border-radius:var(--radius);cursor:pointer;font-size:.9rem;font-family:inherit;font-weight:600;transition:all .15s;background:var(--bg3);color:var(--fg);margin-top:8px;text-align:center;text-decoration:none}
.btn-sso:hover{border-color:var(--accent);background:var(--bg4)}
.btn-sso svg{vertical-align:middle;margin-right:6px}
.login-card{position:relative}
.lang-picker{position:absolute;top:14px;right:14px;z-index:20}
.lang-current{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:5px 8px;cursor:pointer;transition:border .15s,background .15s;user-select:none}
.lang-current:hover{border-color:var(--accent)}
.lang-current .lang-flag{font-size:1.15rem;line-height:1}
.lang-current .lang-caret{color:var(--fg3);font-size:.65rem;transition:transform .18s}
.lang-picker.open .lang-current{border-color:var(--accent)}
.lang-picker.open .lang-current .lang-caret{transform:rotate(180deg)}
.lang-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:150px;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.45);padding:4px;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .16s,transform .16s;max-height:280px;overflow-y:auto}
.lang-picker.open .lang-menu{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.lang-opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--fg);font-family:inherit;font-size:.85rem;padding:7px 9px;border-radius:var(--radius);cursor:pointer;white-space:nowrap}
.lang-opt:hover{background:var(--bg4)}
.lang-opt.sel{color:var(--accent2);font-weight:600}
.lang-opt .lang-flag{font-size:1.1rem;line-height:1}
</style>
</head>
<body>
<div class="login-card">
  <div class="lang-picker" id="lang-picker" style="display:none">
    <div class="lang-current" onclick="toggleLangMenu(event)" data-i18n-title="langTitle" title="Язык интерфейса">
      <span class="lang-flag">🇷🇺</span><span class="lang-caret">▼</span>
    </div>
    <div class="lang-menu"></div>
  </div>
  <h1>&#x2B21; __APP_NAME__</h1>
  <div class="subtitle" id="subtitle" data-i18n="subtitleLogin">Вход в систему</div>

  <div id="login-form">
    <div class="field">
      <label for="username" data-i18n="username">Имя пользователя</label>

    </div>
    <div class="field">
      <label for="password" data-i18n="password">Пароль</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <div id="password-confirm-field" class="field" style="display:none">

      <input type="password" id="password2" autocomplete="new-password">
    </div>
    <div id="totp-field" class="field" style="display:none">

      <input type="text" id="totp-code" autocomplete="one-time-code" inputmode="text" data-i18n-ph="totpPlaceholder" placeholder="123456 или код восстановления">
    </div>
    <div id="db-setup" style="display:none;margin:14px 0;padding-top:14px;border-top:1px solid var(--bg4)">
      <label style="display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:.85rem;cursor:pointer">
        <input type="checkbox" id="db-external" onchange="toggleDbFields()" style="width:auto;margin:0"> <span data-i18n="dbExternal">Использовать внешний PostgreSQL</span>
      </label>
      <div id="db-fields" style="display:none;margin-top:12px">
        <div class="field"><label for="db-host" data-i18n="dbHost">Хост</label><input type="text" id="db-host" placeholder="db или 192.168.1.10"></div>
        <div class="field"><label for="db-port" data-i18n="dbPort">Порт</label><input type="text" id="db-port" placeholder="5432"></div>
        <div class="field"><label for="db-name" data-i18n="dbName">База данных</label><input type="text" id="db-name" placeholder="kanban"></div>
        <div class="field"><label for="db-user" data-i18n="dbUser">Пользователь</label><input type="text" id="db-user" placeholder="kanban"></div>
        <div class="field"><label for="db-pass" data-i18n="dbPass">Пароль БД</label><input type="password" id="db-pass" autocomplete="off"></div>
        <button class="btn" type="button" onclick="testDb()" data-i18n="dbTest" style="background:var(--bg3);color:var(--fg)">Проверить подключение</button>
        <div class="setup-note" id="db-test-status" style="margin-top:8px"></div>
      </div>
    </div>
    <button class="btn" id="submit-btn" onclick="submit()" data-i18n="signIn">Войти</button>
    <div class="error" id="error"></div>
    <div id="forgot-link" style="text-align:center;margin-top:12px">
      <a href="#" onclick="showResetForm();return false" data-i18n="forgot" style="color:var(--accent2);font-size:.82rem;text-decoration:none">Забыли пароль?</a>
    </div>
    <div class="setup-note" id="setup-note" data-i18n="setupNote" style="display:none">
      Первый запуск — создайте учётную запись администратора
    </div>
    <div id="sso-buttons" style="display:none"></div>
  </div>

  <div id="reset-form" style="display:none">
    <div id="reset-step-1">
      <div class="field">
        <label for="reset-username" data-i18n="username">Имя пользователя</label>
        <input type="text" id="reset-username" autocomplete="username">
      </div>
      <button class="btn" onclick="requestReset()" data-i18n="resetSend">Отправить код в Telegram</button>
    </div>
    <div id="reset-step-2" style="display:none">
      <div class="field">
        <label for="reset-code" data-i18n="resetCodeLabel">Код из Telegram</label>
        <input type="text" id="reset-code" autocomplete="off" maxlength="8" inputmode="numeric">
      </div>
      <div class="field">
        <label for="reset-newpw" data-i18n="resetNewPw">Новый пароль</label>
        <input type="password" id="reset-newpw" autocomplete="new-password">
      </div>
      <button class="btn" onclick="confirmReset()" data-i18n="resetChange">Сменить пароль</button>
    </div>
    <div class="error" id="reset-error"></div>
    <div style="text-align:center;margin-top:12px">
      <a href="#" onclick="hideResetForm();return false" data-i18n="backToLogin" style="color:var(--accent2);font-size:.82rem;text-decoration:none">← Вернуться ко входу</a>
    </div>
  </div>
</div>

function loginT(key) {
  const l = LOGIN_I18N[selectedLang];
  return (l && l[key] != null ? l[key] : (LOGIN_I18N.en[key] != null ? LOGIN_I18N.en[key] : key));
}
// loginApplyI18n localizes every static element (and the document title/dir).
function loginApplyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = loginT(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = loginT(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = loginT(el.dataset.i18nTitle); });
  document.documentElement.setAttribute('lang', selectedLang);
  document.documentElement.setAttribute('dir', selectedLang === 'ar' ? 'rtl' : 'ltr');
  const fullName = (typeof window.APP_NAME === 'string' && window.APP_NAME) || document.title.split(' — ')[0];
  document.title = fullName + ' — ' + loginT('titleSuffix');
}

// detectBrowserLang picks the first browser-preferred language we support;
// falls back to Russian when there's no match or no info.
function detectBrowserLang() {
  const codes = SETUP_LANGS.map(l => l.code);
  const cands = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || ''];
  for (const c of cands) {
    const two = (c || '').slice(0, 2).toLowerCase();
    if (codes.includes(two)) return two;
  }
  return 'ru';
}

function renderLangPicker() {
  const wrap = document.getElementById('lang-picker');
  if (!wrap) return;
  const cur = SETUP_LANGS.find(l => l.code === selectedLang) || SETUP_LANGS[0];
  wrap.querySelector('.lang-current .lang-flag').textContent = cur.flag;
  wrap.querySelector('.lang-menu').innerHTML = SETUP_LANGS.map(l =>
    `<button type="button" class="lang-opt${l.code === selectedLang ? ' sel' : ''}" onclick="pickLang('${l.code}')"><span class="lang-flag">${l.flag}</span> ${escHTML(l.name)}</button>`
  ).join('');
}
function toggleLangMenu(e) {
  if (e) e.stopPropagation();
  document.getElementById('lang-picker').classList.toggle('open');
}
function pickLang(code) {
  selectedLang = code;
  renderLangPicker();
  loginApplyI18n();
  document.getElementById('lang-picker').classList.remove('open');
}
document.addEventListener('click', e => {
  const p = document.getElementById('lang-picker');
  if (p && p.classList.contains('open') && !p.contains(e.target)) p.classList.remove('open');
});

async function checkSetup() {
  try {
    const r = await fetch('/api/auth/me');
    if (r.ok) { location.href = '/'; return; }
  } catch {}

  try {
    const r = await fetch('/api/board');
    if (r.status === 401) {
      const text = await r.text();
      if (text.trim() === 'setup required') {
        isSetup = true;
        selectedLang = detectBrowserLang();
        renderLangPicker();
        document.getElementById('lang-picker').style.display = '';
        document.getElementById('subtitle').dataset.i18n = 'subtitleSetup';
        document.getElementById('submit-btn').dataset.i18n = 'createAndSignIn';
        document.getElementById('setup-note').style.display = '';
        loginApplyI18n();
        document.getElementById('password-confirm-field').style.display = '';
        document.getElementById('password').autocomplete = 'new-password';
        // Offer an external DB only if we're not already running on Postgres.
        try {
          const info = await (await fetch('/api/setup/info')).json();
          if (info.can_choose_db) document.getElementById('db-setup').style.display = '';
        } catch {}
      }
    }
  } catch {}
}

const dbVal = id => document.getElementById(id).value.trim();
function dbPayload() {
  return {
    db_host: dbVal('db-host'), db_port: dbVal('db-port'), db_name: dbVal('db-name'),
    db_user: dbVal('db-user'), db_password: document.getElementById('db-pass').value
  };
}
function toggleDbFields() {
  document.getElementById('db-fields').style.display =
    document.getElementById('db-external').checked ? '' : 'none';
}
async function testDb() {
  const el = document.getElementById('db-test-status');
  el.style.color = 'var(--fg3)';
  el.textContent = loginT('dbTesting');
  try {
    const r = await fetch('/api/setup/test-db', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(dbPayload())
    });
    const d = await r.json();
    if (d.ok) { el.style.color = '#22c55e'; el.textContent = loginT('dbOk'); }
    else { el.style.color = 'var(--red)'; el.textContent = '✗ ' + (d.error || loginT('errGeneric')); }
  } catch (e) { el.style.color = 'var(--red)'; el.textContent = '✗ ' + e.message; }
}

async function submit() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';

  if (!username || !password) {
    errorEl.textContent = loginT('errEnterCreds');
    return;
  }

  if (isSetup) {
    const password2 = document.getElementById('password2').value;
    if (password !== password2) {
      errorEl.textContent = loginT('errPwMismatch');
      return;
    }
    if (password.length < 6) {
      errorEl.textContent = loginT('errPwShort');
      return;
    }
    const payload = {username, password, lang: selectedLang};
    const ext = document.getElementById('db-external');
    if (ext && ext.checked) {
      Object.assign(payload, dbPayload(), {db_external: true});
      if (!payload.db_host || !payload.db_name || !payload.db_user) {
        errorEl.textContent = loginT('errFillPg');
        return;
      }
    }
    try {
      const r = await fetch('/api/auth/setup', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if (!r.ok) {
        errorEl.textContent = await r.text();
        return;
      }
      let data = {};
      try { data = await r.json(); } catch {}
      try { localStorage.setItem('kanban-lang', selectedLang); } catch {}
      if (data.restarting) {
        const sub = document.getElementById('subtitle');
        sub.dataset.i18n = 'subtitleApplying'; sub.textContent = loginT('subtitleApplying');
        errorEl.style.color = 'var(--accent2)';
        errorEl.textContent = loginT('restartingMsg');
        setTimeout(() => location.href = '/', 3500);
        return;
      }
      location.href = '/';
    } catch (e) {
      errorEl.textContent = loginT('errPrefix') + e.message;
    }
  } else {
    try {
      const code = (document.getElementById('totp-code').value || '').trim();
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password, code})
      });
      if (!r.ok) {
        let body = {};
        try { body = await r.json(); } catch (e) {}
        if (body.totp_required) {
          document.getElementById('totp-field').style.display = '';
          document.getElementById('totp-code').focus();
          errorEl.textContent = body.error ? loginT('badTotp') : loginT('enterTotp');
          return;
        }
        errorEl.textContent = loginT('errBadCreds');
        return;
      }
      location.href = '/';
    } catch (e) {
      errorEl.textContent = loginT('errPrefix') + e.message;
    }
  }
}

function showResetForm() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('reset-form').style.display = '';
  const sub = document.getElementById('subtitle');
  sub.dataset.i18n = 'subtitleReset'; sub.textContent = loginT('subtitleReset');
  document.getElementById('forgot-link').style.display = 'none';
}
function hideResetForm() {
  document.getElementById('login-form').style.display = '';
  document.getElementById('reset-form').style.display = 'none';
  const sub = document.getElementById('subtitle');
  sub.dataset.i18n = isSetup ? 'subtitleSetup' : 'subtitleLogin'; sub.textContent = loginT(sub.dataset.i18n);
  document.getElementById('forgot-link').style.display = '';
  document.getElementById('reset-step-1').style.display = '';
  document.getElementById('reset-step-2').style.display = 'none';
  document.getElementById('reset-error').textContent = '';
  document.getElementById('reset-username').value = '';
  resetUsername = '';
}

async function requestReset() {
  const username = document.getElementById('reset-username').value.trim();
  const errEl = document.getElementById('reset-error');
  errEl.textContent = '';
  errEl.style.color = 'var(--red)';
  if (!username) { errEl.textContent = loginT('resetEnterUser'); return; }
  try {
    const r = await fetch('/api/auth/reset-request', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username})
    });
    if (!r.ok) { errEl.textContent = loginT('errGeneric'); return; }
    resetUsername = username;
    document.getElementById('reset-step-1').style.display = 'none';
    document.getElementById('reset-step-2').style.display = '';
    errEl.style.color = 'var(--accent2)';
    errEl.textContent = loginT('resetSentMsg');
  } catch(e) { errEl.textContent = loginT('errPrefix') + e.message; }
}

async function confirmReset() {
  const code = document.getElementById('reset-code').value.trim();
  const newpw = document.getElementById('reset-newpw').value;
  const errEl = document.getElementById('reset-error');
  errEl.style.color = 'var(--red)';
  errEl.textContent = '';
  if (!code || !newpw) { errEl.textContent = loginT('resetFill'); return; }
  if (newpw.length < 6) { errEl.textContent = loginT('errPwShort'); return; }
  try {
    const r = await fetch('/api/auth/reset-confirm', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: resetUsername, code, new_password: newpw})
    });
    if (!r.ok) { errEl.textContent = loginT('resetBadCode'); return; }
    errEl.style.color = 'var(--accent2)';
    errEl.textContent = loginT('resetDone');
    setTimeout(() => hideResetForm(), 2000);
  } catch(e) { errEl.textContent = loginT('errPrefix') + e.message; }
}

// SSO buttons
async function loadSSOConfig() {
  try {
    const r = await fetch('/api/auth/sso/config');
    if (!r.ok) return;
    const cfg = await r.json();
    const container = document.getElementById('sso-buttons');
    let html = '';
    if (cfg.oidc_enabled || cfg.ldap_enabled) {
      html += `<div class="sso-divider">${escHTML(loginT('or'))}</div>`;
    }
    if (cfg.oidc_enabled) {
      html += `<a href="/api/auth/oidc/login" class="btn-sso"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>${escHTML(cfg.oidc_label)}</a>`;
    }
    if (cfg.ldap_enabled) {
      html += `<div class="setup-note" style="margin-top:8px;color:var(--fg3)">${escHTML(cfg.ldap_label)} — ${escHTML(loginT('ldapHint'))}</div>`;
    }
    if (html) {
      container.innerHTML = html;
      container.style.display = '';
    }
  } catch {}
}

function escHTML(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Enter to submit
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') submit();
});

// Localize the page to the browser language on load; the setup flag picker can
// override it (and sets the instance default).
selectedLang = detectBrowserLang();
loginApplyI18n();
checkSetup();
loadSSOConfig();
</script>
</body>
</html>
