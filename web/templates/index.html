async function startSprint(sprintId) {
  const today = new Date().toISOString().slice(0,10);
  const twoWeeks = new Date(Date.now() + 14*86400000).toISOString().slice(0,10);
  const sp = state.sprints.find(s => s.id === sprintId);
  try {
    await api('/api/sprints/' + sprintId, 'PUT', {
      name: sp.name,
      start_date: sp.start_date || today,
      end_date: sp.end_date || twoWeeks,
      status: 'active'
    });
    await loadBoard();
    renderSprintPage(sprintId);
  } catch(e) { alert(t('error')); }
}

function showCompleteSprint(sprintId) {
  const otherSprints = [...state.sprints].filter(s => s.id !== sprintId && s.status !== 'completed').sort((a,b) => b.id - a.id);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  let opts = `<option value="">${t('moveToBacklog')}</option>`;
  for (const sp of otherSprints) {
    opts += `<option value="${sp.id}">${esc(sp.name)}</option>`;
  }
  overlay.innerHTML = `<div class="modal">
    <div class="modal-header"><h2>${t('completeSprint')}</h2><button class="btn-icon" onclick="this.closest('.modal-overlay').remove()">&#10005;</button></div>
    <div class="modal-body">
      <p style="margin-bottom:12px">${t('completeSprintConfirm')}</p>
      <div class="field"><label>${t('moveToNextSprint')}</label><select id="complete-sprint-target">${opts}</select></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">${t('cancel')}</button>
      <button class="btn btn-primary" onclick="doCompleteSprint(${sprintId})">${t('completeSprint')}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

async function doCompleteSprint(sprintId) {
  const targetEl = document.getElementById('complete-sprint-target');
  const targetVal = targetEl ? targetEl.value : '';
  const body = {};
  if (targetVal) body.move_to_sprint_id = parseInt(targetVal);
  try {
    await api('/api/sprints/' + sprintId + '/complete', 'POST', body);
    document.querySelector('.modal-overlay').remove();
    await loadBoard();
    renderSprintPage(sprintId);
  } catch(e) { alert(t('error')); }
}

// --- Backlog Page (Sprint Planning) ---
function renderBacklogPage() {
  const app = document.getElementById('app');
  const firstCol = state.columns.length ? state.columns[0] : null;
  const backlogColId = firstCol ? firstCol.id : null;

  // Group tasks: unassigned (no sprint) and per-sprint
  const unassignedTasks = state.tasks.filter(t => !t.sprint_id);
  const activeSprints = [...state.sprints].filter(s => s.status !== 'completed').sort((a,b) => b.id - a.id);

  let html = `<div class="epic-page">
    <div class="epic-page-header">
      <h2>&#128203; ${t('sprintBacklog')}</h2>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="navigateTo('/')">${t('back')}</button>
      </div>
    </div>`;

  // Render each active sprint section
  for (const sprint of activeSprints) {
    const sprintTasks = state.tasks.filter(t => t.sprint_id === sprint.id);
    const lastCol = state.columns.length ? state.columns[state.columns.length-1] : null;
    const doneCount = lastCol ? sprintTasks.filter(t => t.column_id === lastCol.id).length : 0;
    const pct = sprintTasks.length ? Math.round(doneCount / sprintTasks.length * 100) : 0;
    const statusLabels = {planning: t('sprintPlanning'), active: t('sprintActive'), completed: t('sprintCompleted')};
    const statusColors = {planning: 'var(--fg3)', active: 'var(--green)', completed: 'var(--blue)'};

    html += `<div class="task-page-section" style="margin-bottom:16px;border:1px solid var(--bg4);border-radius:var(--radius-lg);padding:12px"
      ondragover="event.preventDefault();this.style.borderColor='var(--accent)'" ondragleave="this.style.borderColor='var(--bg4)'"
      ondrop="event.preventDefault();this.style.borderColor='var(--bg4)';dropToSprint(event,${sprint.id})">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0;cursor:pointer" onclick="navigateTo('/sprint/${sprint.id}')">
          &#127947; ${esc(sprint.name)}
          <span style="font-size:.78rem;color:${statusColors[sprint.status]||'var(--fg3)'};font-weight:normal;margin-left:6px">${statusLabels[sprint.status]||sprint.status}</span>
        </h3>
        <span style="font-size:.78rem;color:var(--fg3)">${doneCount}/${sprintTasks.length} (${pct}%)</span>
      </div>
      <div class="epic-task-list">`;
    for (const task of sprintTasks) {
      html += renderBacklogTaskRow(task);
    }
    if (!sprintTasks.length) html += `<p style="color:var(--fg3);font-size:.82rem;padding:4px 0">${t('noActiveTasks')}</p>`;
    html += '</div></div>';
  }

  // Unassigned tasks (backlog)
  html += `<div class="task-page-section" style="border:1px solid var(--bg4);border-radius:var(--radius-lg);padding:12px"
    ondragover="event.preventDefault();this.style.borderColor='var(--accent)'" ondragleave="this.style.borderColor='var(--bg4)'"
    ondrop="event.preventDefault();this.style.borderColor='var(--bg4)';dropToSprint(event,null)">
    <h3 style="margin-bottom:8px">${t('unassigned')} (${unassignedTasks.length})</h3>
    <div class="epic-task-list">`;
  for (const task of unassignedTasks) {
    html += renderBacklogTaskRow(task);
  }
  if (!unassignedTasks.length) html += `<p style="color:var(--fg3);font-size:.82rem;padding:4px 0">${t('noActiveTasks')}</p>`;
  html += '</div></div></div>';
  app.innerHTML = html;
}

function renderBacklogTaskRow(task) {
  const colName = state.columns.find(c => c.id === task.column_id);
  const prioColors = ['','var(--blue)','var(--green)','var(--orange)','var(--red)'];
  const epicBadge = task.epic ? `<span class="card-epic" style="background:${task.epic.color};color:${contrastColor(task.epic.color)};font-size:.7rem;padding:1px 5px">${esc(task.epic.name)}</span>` : '';
  return `<div class="epic-task-row" draggable="true" data-task-id="${task.id}"
    ondragstart="event.dataTransfer.setData('text/plain','${task.id}');if(!_dragListenerActive){document.addEventListener('dragover',dragAutoScroll);_dragListenerActive=true}"
    ondragend="if(_dragListenerActive){document.removeEventListener('dragover',dragAutoScroll);_dragListenerActive=false}"
    onclick="navigateTo('/task/${task.id}')">
    <span class="card-id">${taskRef(task)}</span>
    <span class="epic-task-title">${esc(task.title)}</span>
    ${epicBadge}
    ${task.priority > 0 ? `<span class="epic-task-prio" style="color:${prioColors[task.priority]}">P${task.priority}</span>` : ''}
    <span class="epic-task-status">${colName ? esc(colName.name) : ''}</span>
  </div>`;
}

async function dropToSprint(event, sprintId) {
  const taskId = parseInt(event.dataTransfer.getData('text/plain'));
  if (!taskId) return;
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  // Update task sprint_id
  try {
    await api('/api/tasks/' + taskId, 'PUT', {
      title: task.title, description: task.description, todo: task.todo, project_url: task.project_url,
      column_id: task.column_id, epic_id: task.epic_id, sprint_id: sprintId,
      assignee_id: task.assignee_id, priority: task.priority,
      tag_ids: (task.tags||[]).map(t => t.id), depends_on_ids: (task.depends_on||[]).map(d => d.id),
      deadline: task.deadline || ''
    });
    task.sprint_id = sprintId;
    task.sprint = sprintId ? state.sprints.find(s => s.id === sprintId) || null : null;
    renderBacklogPage();
  } catch(e) { alert(t('error') + ': ' + e.message); }
}
function showEditEpic(epicId) {
  const epic = state.epics.find(e => e.id === epicId);
  if (!epic) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal">
    <div class="modal-header"><h2>${t('editEpic')}</h2><button class="btn-icon" onclick="this.closest('.modal-overlay').remove()">&#10005;</button></div>
    <div class="modal-body">
      <div class="field"><label>${t('title')}</label><input id="epic-edit-name" value="${escAttr(epic.name)}"></div>
      <div class="field"><label>Color</label><input type="color" id="epic-edit-color" value="${epic.color}"></div>
      <div class="field"><label>${t('description')}</label>
        ${insertMdToolbar('epic-edit-desc')}
        <textarea id="epic-edit-desc" rows="4">${esc(epic.description || '')}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">${t('cancel')}</button>
      <button class="btn btn-primary" onclick="saveEpicEdit(${epicId})">${t('save')}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}
async function saveEpicEdit(epicId) {
  const name = document.getElementById('epic-edit-name').value.trim();
  const color = document.getElementById('epic-edit-color').value;
  const desc = document.getElementById('epic-edit-desc').value;
  if (!name) return;
  try { await api('/api/epics/' + epicId, 'PUT', { name, color, description: desc }); document.querySelector('.modal-overlay').remove(); await loadBoard(); renderEpicPage(epicId); } catch(e) { alert(t('error')); }
}

// === CRUD: Tags ===
async function addTag() {
  const nameEl = document.getElementById('tag-name');
  const colorEl = document.getElementById('tag-color');
  if (!nameEl || !nameEl.value.trim()) return;
  try { await api('/api/tags', 'POST', { Name: nameEl.value.trim(), Color: colorEl.value }); nameEl.value = ''; await loadBoard(); } catch(e) { alert(t('error')); }
}
async function deleteTag(id) {
  if (!await uiConfirm(t('confirmDeleteTag') + '?')) return;
  try { await api('/api/tags/' + id, 'DELETE'); await loadBoard(); } catch(e) { alert(t('error')); }
}

// === CRUD: Users ===
async function addUser() {
  const nameEl = document.getElementById('new-user-name');
  const passEl = document.getElementById('new-user-pass');
  const roleEl = document.getElementById('new-user-role');
  if (!nameEl || !passEl || !nameEl.value.trim() || passEl.value.length < 6) { alert(t('userRequired')); return; }
  try {
    await api('/api/users', 'POST', { username: nameEl.value.trim(), password: passEl.value, role: roleEl.value });
    nameEl.value = ''; passEl.value = '';
    await loadBoard();
  } catch(e) { alert(t('error') + ': ' + e.message); }
}
async function deleteUser(id) {
  if (!await uiConfirm(t('confirmDeleteUser') + '?')) return;
  try { await api('/api/users/' + id, 'DELETE'); await loadBoard(); } catch(e) { alert(t('error') + ': ' + e.message); }
}
async function changeUserRole(id, currentRole) {
  const roles = ['admin','regular','readonly'];
  const nextIdx = (roles.indexOf(currentRole) + 1) % roles.length;
  const newRole = roles[nextIdx];
  try { await api('/api/users/' + id, 'PUT', { role: newRole }); await loadBoard(); } catch(e) { alert(t('error')); }
}
async function resetUserPassword(id) {
  const pw = await uiPrompt(t('newPassword'));
  if (!pw || pw.length < 6) { if (pw !== null) alert(t('userRequired')); return; }
  try { await api('/api/users/' + id, 'PUT', { password: pw }); toast(t('passwordChanged'), 'success'); } catch(e) { alert(t('error')); }
}

// === Own password change ===
async function changeOwnPassword() {
  const pw = await uiPrompt(t('newPassword'));
  if (!pw || pw.length < 6) { if (pw !== null) alert(t('userRequired')); return; }
  try { await api('/api/user/password', 'POST', { password: pw }); toast(t('passwordChanged'), 'success'); } catch(e) { alert(t('error')); }
}

// === Export / Import ===
async function exportBoard() {
  try {
    const r = await fetch('/api/export');
    if (!r.ok) throw new Error(await r.text());
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'kanban-export.json'; a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert(t('exportError')); }
}
async function importBoard(input) {
  const file = input.files[0];
  if (!file) return;
  if (!await uiConfirm(t('importConfirm'))) { input.value = ''; return; }
  try {
    let text;
    if ((file.name.endsWith('.gz') || file.type === 'application/gzip') && typeof DecompressionStream !== 'undefined') {
      const stream = file.stream().pipeThrough(new DecompressionStream('gzip'));
      text = await new Response(stream).text();
    } else {
      text = await file.text();
    }
    let data;
    try { data = JSON.parse(text); } catch(pe) { alert(t('importError') + ': invalid JSON'); input.value = ''; return; }
    if (!data || !Array.isArray(data.columns) || !Array.isArray(data.tasks)) { alert(t('importError') + ': invalid structure'); input.value = ''; return; }
    await api('/api/import', 'POST', data);
    input.value = '';
    toast(t('importDone'), 'success');
    await loadBoard();
  } catch(e) { alert(t('importError') + ': ' + e.message); }
}

// === Backups ===
async function loadBackups() {
  const list = document.getElementById('backup-list');
  if (!list) return;
  try {
    const data = await api('/api/backups');
    const backups = data.backups || [];
    if (!backups.length) {
      list.innerHTML = `<p style="color:var(--fg3);font-size:.82rem">${t('noBackups')}</p>`;
      return;
    }
    list.innerHTML = backups.map(b => {
      const sizeMB = (b.size / 1024 / 1024).toFixed(1);
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bg3);font-size:.82rem">
        <div style="min-width:0;overflow:hidden">
          <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.name)}</div>
          <div style="color:var(--fg3);font-size:.75rem">${b.created} &middot; ${sizeMB} MB</div>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0;margin-left:8px">
          <button class="btn btn-ghost btn-sm" onclick="restoreBackup('${esc(b.name)}')" title="${t('restoreBackup')}">&#128260;</button>
          <button class="btn btn-ghost btn-sm" onclick="downloadBackup('${esc(b.name)}')" title="${t('downloadBackup')}">&#128229;</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteBackup('${esc(b.name)}')" title="${t('delete')}" style="color:var(--red)">&#128465;</button>
        </div>
      </div>`;
    }).join('');
  } catch(e) { list.innerHTML = `<p style="color:var(--red);font-size:.82rem">${t('error')}</p>`; }
}

async function createBackup() {
  try {
    await api('/api/backups', 'POST');
    loadBackups();
  } catch(e) { alert(t('error')); }
}

async function restoreBackup(name) {
  if (!await uiConfirm(t('restoreConfirm'))) return;
  try {
    await api('/api/backups/' + encodeURIComponent(name), 'POST');
    toast(t('restoreDone'), 'success');
    await loadBoard();
  } catch(e) { alert(t('error') + ': ' + e.message); }
}

async function downloadBackup(name) {
  try {
    const r = await fetch('/api/backups/' + encodeURIComponent(name));
    if (!r.ok) throw new Error(await r.text());
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert(t('error')); }
}

async function deleteBackup(name) {
  if (!await uiConfirm(t('deleteBackupConfirm'))) return;
  try {
    await api('/api/backups/' + encodeURIComponent(name), 'DELETE');
    loadBackups();
  } catch(e) { alert(t('error')); }
}

// === Logout ===
async function logout() {
  try { await api('/api/auth/logout', 'POST'); } catch {}
  window.location.href = '/login';
}

// === Close sidebar on outside click ===
document.addEventListener('click', function(e) {
  const sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('open') && !e.target.closest('.sidebar') && !e.target.closest('[onclick*="toggleSidebar"]')) {
    sidebar.classList.remove('open');
  }
});

// === Keyboard shortcuts ===
let _preModalFocus = null;
document.addEventListener('keydown', function(e) {
  // Ctrl/Cmd+K focuses the unified search field
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    const s = document.getElementById('search');
    if (s) { s.focus(); s.select(); }
    return;
  }
  if (e.key === 'Escape') {
    const modal = document.querySelector('.modal-overlay');
    if (modal) {
      modal.remove();
      if (_preModalFocus && document.contains(_preModalFocus)) {
        _preModalFocus.focus();
        _preModalFocus = null;
      }
      return;
    }
    const sidebar = document.getElementById('sidebar');
    if (sidebar && sidebar.classList.contains('open')) sidebar.classList.remove('open');
  }
});

// === Start ===
init();
</script>
</body>
</html>
