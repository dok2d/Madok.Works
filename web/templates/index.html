<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__APP_NAME__</title>
<script>window.APP_NAME = __APP_NAME_JS__;</script>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/atom-one-dark.min.css">
<script src="/static/js/marked.min.js"></script>
<script src="/static/js/highlight.min.js"></script>
<script src="/static/js/wiki.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/calendar.js"></script>
<script src="/static/js/mail.js"></script>
<script src="/static/js/admin.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* === Theme variables === */
:root, [data-theme="dark"]{
  --bg:#0f1117;--bg2:#181a24;--bg3:#1e2030;--bg4:#262840;
  --fg:#c8cad8;--fg2:#8b8fa8;--fg3:#5c6078;
  --accent:#7c6ff7;--accent2:#a78bfa;
  --red:#ef4444;--orange:#f59e0b;--green:#22c55e;--blue:#3b82f6;--weekend:#7d2b3a;
  --radius:6px;--radius-lg:10px;
  --shadow:0 2px 8px rgba(0,0,0,.3);
  --col-w:300px;
  --font-size:18px;
}
[data-theme="light"]{
  --bg:#f5f5f7;--bg2:#ffffff;--bg3:#eef0f4;--bg4:#d8dbe5;
  --fg:#1a1a2e;--fg2:#4a4e69;--fg3:#8b8fa8;
  --accent:#6c5ce7;--accent2:#5b4cdb;
  --red:#dc2626;--orange:#d97706;--green:#16a34a;--blue:#2563eb;--weekend:#a83246;
  --shadow:0 2px 8px rgba(0,0,0,.1);
}
[data-theme="ocean"]{
  --bg:#0b1622;--bg2:#101d2e;--bg3:#162435;--bg4:#1e3148;
  --fg:#c4d4e0;--fg2:#7f99b0;--fg3:#506882;
  --accent:#0ea5e9;--accent2:#38bdf8;
  --red:#f43f5e;--orange:#fb923c;--green:#34d399;--blue:#60a5fa;--weekend:#8b2c44;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
[data-theme="forest"]{
  --bg:#0f1a0f;--bg2:#162016;--bg3:#1c2b1c;--bg4:#2a3f2a;
  --fg:#c4d8c4;--fg2:#88a888;--fg3:#5c7a5c;
  --accent:#22c55e;--accent2:#4ade80;
  --red:#ef4444;--orange:#f59e0b;--green:#22c55e;--blue:#60a5fa;--weekend:#7a3340;
  --shadow:0 2px 8px rgba(0,0,0,.35);
}
[data-theme="nord"]{
  --bg:#2e3440;--bg2:#3b4252;--bg3:#434c5e;--bg4:#4c566a;
  --fg:#eceff4;--fg2:#d8dee9;--fg3:#8892a6;
  --accent:#88c0d0;--accent2:#81a1c1;
  --red:#bf616a;--orange:#d08770;--green:#a3be8c;--blue:#5e81ac;--weekend:#9d5560;
  --shadow:0 2px 8px rgba(0,0,0,.3);
}
[data-theme="dracula"]{
  --bg:#282a36;--bg2:#21222c;--bg3:#313545;--bg4:#44475a;
  --fg:#f8f8f2;--fg2:#bfc1d4;--fg3:#6272a4;
  --accent:#bd93f9;--accent2:#ff79c6;
  --red:#ff5555;--orange:#ffb86c;--green:#50fa7b;--blue:#8be9fd;--weekend:#b03a55;
  --shadow:0 2px 8px rgba(0,0,0,.35);
}
[data-theme="solarized"]{
  --bg:#fdf6e3;--bg2:#eee8d5;--bg3:#e8e1ca;--bg4:#d6cdb5;
  --fg:#586e75;--fg2:#657b83;--fg3:#93a1a1;
  --accent:#268bd2;--accent2:#2aa198;
  --red:#dc322f;--orange:#cb4b16;--green:#859900;--blue:#268bd2;--weekend:#a8324a;
  --shadow:0 2px 8px rgba(0,0,0,.08);
}
[data-theme="spacedust"]{
  --bg:#0a0e14;--bg2:#131920;--bg3:#1a222c;--bg4:#253040;
  --fg:#dfd5c1;--fg2:#b0a890;--fg3:#6e6b5e;
  --accent:#e7a84f;--accent2:#e35b00;
  --red:#e24c49;--orange:#e7a84f;--green:#5cab7d;--blue:#6e98a4;--weekend:#9a3b3a;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}

html{font-size:var(--font-size)}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
a{color:var(--accent2);text-decoration:none}

.header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--bg2);border-bottom:1px solid var(--bg4);position:fixed;top:0;left:0;right:0;z-index:100;height:52px}
.header h1{font-family:'JetBrains Mono',monospace;font-size:1.1rem;color:var(--accent2);letter-spacing:-.02em;display:flex;align-items:center;gap:0}

/* === App rail (ecosystem navigation) === */
.app-rail{position:fixed;left:0;top:52px;bottom:0;width:52px;background:var(--bg2);border-right:1px solid var(--bg4);display:none;flex-direction:column;align-items:center;padding:10px 0;gap:6px;z-index:120}
body.has-rail .app-rail{display:flex}
body.has-rail #app{margin-left:52px}
.rail-btn{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);color:var(--fg2);font-size:1.15rem;cursor:pointer;border:none;background:none;text-decoration:none;transition:background .15s,color .15s}
.rail-btn:hover{background:var(--bg3);color:var(--fg)}
.rail-btn.active{background:var(--bg3);color:var(--accent)}
.rail-btn.active::before{content:'';position:absolute;left:-7px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.rail-badge{position:absolute;top:1px;right:1px;min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:.62rem;font-weight:600;line-height:15px;text-align:center;padding:0 3px}
.rail-sep{width:26px;height:1px;background:var(--bg4);margin:4px 0;flex-shrink:0}
.rail-admin{margin-top:auto}
@media (max-width:760px){ .rail-admin{margin-top:0} }
[dir="rtl"] .app-rail{left:auto;right:0;border-right:none;border-left:1px solid var(--bg4)}
[dir="rtl"] body.has-rail #app{margin-left:0;margin-right:52px}
[dir="rtl"] .rail-btn.active::before{left:auto;right:-7px}

/* === Wiki === */
.wiki-layout{display:flex;height:calc(100vh - 52px)}
.wiki-side{width:270px;min-width:270px;background:var(--bg2);border-right:1px solid var(--bg4);display:flex;flex-direction:column;padding:12px;gap:8px;overflow-y:auto}
[dir="rtl"] .wiki-side{border-right:none;border-left:1px solid var(--bg4)}
.wiki-hdr-btn{margin-left:4px}
.wiki-space-bar{display:flex;gap:4px;align-items:center}
.wiki-space-select{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:7px 8px;color:var(--fg);font-size:.85rem}
.wiki-search{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:7px 10px;color:var(--fg);font-size:.82rem;width:100%}
.wiki-search:focus{outline:none;border-color:var(--accent)}
.wiki-search-results{max-height:40vh;overflow-y:auto;border:1px solid var(--bg4);border-radius:var(--radius);background:var(--bg3)}
.wiki-hit{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bg4)}
.wiki-hit:hover{background:var(--bg4)}
.wiki-hit-title{font-size:.82rem;font-weight:600}
.wiki-hit-snippet{font-size:.74rem;color:var(--fg2);margin-top:2px}
.wiki-tree{flex:1;overflow-y:auto;font-size:.86rem}
.wiki-node{margin-left:calc(var(--depth) * 0px)}
.wiki-node-row{display:flex;align-items:center;gap:2px;padding:3px 4px 3px calc(4px + var(--depth) * 14px);border-radius:var(--radius);cursor:pointer}
.wiki-node-row:hover{background:var(--bg3)}
.wiki-node-row.active{background:var(--bg3)}
.wiki-node-row.active .wiki-node-title{color:var(--accent);font-weight:600}
.wiki-expander{width:16px;text-align:center;color:var(--fg3);cursor:pointer;flex-shrink:0;font-size:.7rem}
.wiki-expander-spacer{width:16px;flex-shrink:0}
.wiki-node-title{flex:1;color:var(--fg);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiki-node-add{visibility:hidden;background:none;border:none;color:var(--fg3);cursor:pointer;font-size:.9rem;padding:0 4px}
.wiki-node-row:hover .wiki-node-add{visibility:visible}
.wiki-node-add:hover{color:var(--accent)}
.wiki-add-root{width:100%}
.wiki-main{flex:1;overflow-y:auto;padding:24px 36px 60px}
.wiki-breadcrumbs{font-size:.8rem;color:var(--fg2);margin-bottom:10px}
.wiki-breadcrumbs a{color:var(--fg2);cursor:pointer;text-decoration:none}
.wiki-breadcrumbs a:hover{color:var(--accent)}
.wiki-bc-sep{color:var(--fg3);margin:0 2px}
.wiki-sync-toggle{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:.74rem;color:var(--fg3);padding:4px 2px;cursor:pointer;user-select:none}
.wiki-sync-toggle input{width:auto;margin:0;cursor:pointer}
.wiki-md-split{display:flex;gap:10px;align-items:stretch}
.wiki-md-input{flex:1;min-height:50vh;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:12px;color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:.85rem;resize:vertical}
.wiki-md-preview{flex:1;min-height:50vh;overflow-y:auto;border:1px solid var(--bg4);border-radius:var(--radius);padding:12px 16px;background:var(--bg)}
@media (max-width:760px){ .wiki-md-split{flex-direction:column} }
.wiki-popover{position:fixed;z-index:300;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:6px}
.wiki-pop-row{display:flex;gap:6px;align-items:center}
.wiki-pop-row input{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 8px;color:var(--fg);font-size:.85rem;min-width:80px}
.wiki-pop-row input[type=text],.wiki-pop-row #wiki-pop-url,.wiki-pop-row #wiki-pop-text{min-width:220px}
.wiki-pop-btns{display:flex;gap:6px;justify-content:flex-end}
.wiki-grid-label{font-size:.78rem;color:var(--fg2);text-align:center}
.wiki-grid{display:grid;grid-template-columns:repeat(8,18px);gap:2px}
.wiki-grid-cell{width:18px;height:18px;border:1px solid var(--bg4);border-radius:2px;cursor:pointer}
.wiki-grid-cell.on{background:var(--accent);border-color:var(--accent)}
.wiki-callout-list{display:flex;flex-direction:column;gap:4px}
.wiki-callout-opt{text-align:left;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 10px;cursor:pointer;color:var(--fg)}
.wiki-callout-opt:hover{border-color:var(--accent)}
/* === Chat service === */
.chat-layout{display:flex;height:calc(100vh - 52px)}
.chat-side{width:260px;min-width:260px;background:var(--bg2);border-right:1px solid var(--bg4);display:flex;flex-direction:column;padding:12px;gap:8px;overflow-y:auto}
[dir="rtl"] .chat-side{border-right:none;border-left:1px solid var(--bg4)}
.chat-side-head{display:flex;gap:4px;align-items:center}
.chat-search{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:7px 10px;color:var(--fg);font-size:.82rem}
.chat-search:focus{outline:none;border-color:var(--accent)}
.chat-search-results{max-height:40vh;overflow-y:auto;border:1px solid var(--bg4);border-radius:var(--radius);background:var(--bg3)}
.chat-hit{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bg4)}
.chat-hit:hover{background:var(--bg4)}
.chat-hit-title{font-size:.8rem;font-weight:600}
.chat-hit-snippet{font-size:.74rem;color:var(--fg2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-channels{flex:1;overflow-y:auto}
.chat-grp{margin-bottom:10px}
.chat-grp-head{display:flex;align-items:center;justify-content:space-between;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3);padding:4px 6px}
.chat-grp-add{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:1rem;line-height:1;padding:0 4px}
.chat-grp-add:hover{color:var(--accent)}
.chat-av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:.82rem;user-select:none}
.chat-av-sm{width:30px;height:30px;font-size:.72rem}
.chat-ch-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--radius);cursor:pointer}
.chat-ch-row:hover{background:var(--bg3)}
.chat-ch-row.active{background:var(--bg3)}
.chat-ch-row.active .chat-ch-name{color:var(--accent)}
.chat-ch-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.chat-ch-line1{display:flex;align-items:baseline;gap:6px}
.chat-ch-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem;font-weight:500}
.chat-ch-time{font-size:.66rem;color:var(--fg3);flex-shrink:0}
.chat-ch-line2{display:flex;align-items:center;gap:6px}
.chat-ch-preview{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem;color:var(--fg3)}
.chat-ch-row.chat-contact .chat-ch-name{color:var(--fg2)}
.chat-ch-row.chat-contact:hover .chat-ch-name{color:var(--fg)}
.chat-ch-badge{background:var(--accent);color:#fff;font-size:.62rem;font-weight:600;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;padding:0 5px;flex-shrink:0}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--bg4)}
.chat-head-info{flex:1;min-width:0}
.chat-head-title{font-size:1rem;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head-topic{font-size:.76rem;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head-typing{font-size:.74rem;color:var(--accent);height:0;overflow:hidden}
.chat-head-typing.on{height:auto}
.chat-head-actions{display:flex;gap:6px;flex-shrink:0}
.chat-msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.chat-day{align-self:center;font-size:.7rem;color:var(--fg3);background:var(--bg2);border-radius:10px;padding:2px 10px;margin:10px 0}
.chat-mention{color:var(--accent);font-weight:600}
.chat-side-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3)}
/* System / deleted rows (centered, muted) */
.chat-sys{align-self:center;font-size:.72rem;color:var(--fg3);background:var(--bg2);border-radius:10px;padding:2px 12px;margin:4px 0;max-width:80%;text-align:center}
.chat-del-row{font-style:italic;opacity:.8}
/* Message bubbles (Telegram-style) */
.chat-msg{display:flex;gap:8px;max-width:100%;align-items:flex-end}
.chat-msg.mine{flex-direction:row-reverse}
.chat-msg.grouped{margin-top:-1px}
.chat-av-spacer{width:30px;flex-shrink:0}
.chat-bubble-wrap{max-width:72%;min-width:0;display:flex;flex-direction:column;gap:3px;position:relative}
.chat-msg.mine .chat-bubble-wrap{align-items:flex-end}
.chat-bubble{padding:6px 10px;border-radius:14px;font-size:.9rem;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere;max-width:100%}
.chat-msg.their .chat-bubble{background:var(--bg3);border-bottom-left-radius:5px}
.chat-msg.their.grouped .chat-bubble{border-bottom-left-radius:14px}
.chat-msg.mine .chat-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.chat-msg.mine .chat-bubble a{color:#fff;text-decoration:underline}
.chat-msg.mine .chat-bubble .chat-mention{color:#fff;text-decoration:underline}
.chat-bubble-author{font-size:.78rem;font-weight:600;margin-bottom:2px}
.chat-meta{float:right;margin:6px -2px -2px 10px;font-size:.6rem;opacity:.7;white-space:nowrap;display:inline-flex;gap:4px;align-items:center;line-height:1}
.chat-msg.mine .chat-meta{opacity:.85}
.chat-edited{font-style:italic}
.chat-checks{font-size:.62rem}
.chat-checks.read{color:#7bd0ff}
.chat-pin-mark{opacity:.9}
.chat-msg-menu-btn{display:none;position:absolute;top:-11px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);color:var(--fg3);cursor:pointer;font-size:.9rem;line-height:1;padding:1px 6px;z-index:3;box-shadow:var(--shadow)}
.chat-msg.their .chat-msg-menu-btn{right:0}
.chat-msg.mine .chat-msg-menu-btn{left:0}
.chat-bubble-wrap:hover .chat-msg-menu-btn{display:inline-block}
.chat-msg-menu-btn:hover{color:var(--accent)}
.chat-msg-menu{position:fixed;z-index:320;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:4px 0;min-width:150px}
.chat-msg-menu a{display:block;padding:7px 14px;font-size:.84rem;color:var(--fg);cursor:pointer}
.chat-msg-menu a:hover{background:var(--bg3)}
.chat-danger{color:var(--red) !important}
.chat-loadmore{align-self:center;font-size:.78rem;color:var(--accent);cursor:pointer;padding:6px 12px}
.chat-loadmore:hover{text-decoration:underline}
.chat-composer{display:flex;gap:8px;align-items:flex-end;padding:12px 20px;border-top:1px solid var(--bg4)}
.chat-input{flex:1;resize:none;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:9px 12px;color:var(--fg);font-size:.9rem;font-family:inherit;line-height:1.4;max-height:140px}
.chat-input:focus{outline:none;border-color:var(--accent)}
.chat-readonly{padding:14px 20px;color:var(--fg3);font-size:.82rem;border-top:1px solid var(--bg4);text-align:center}
.chat-attach-btn{flex-shrink:0;font-size:1.1rem;line-height:1}
.chat-pending{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px}
.chat-pending:empty{padding:0}
.chat-pending-chip{font-size:.76rem;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:3px 8px}
.chat-pending-chip a{cursor:pointer;color:var(--red);margin-left:4px}
/* Pinned-message bar (Telegram-style) */
.chat-pinned-bar{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--bg4);background:var(--bg2)}
.chat-pinned-inner{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;border-left:2px solid var(--accent);padding-left:10px}
.chat-pinned-icon{color:var(--accent);flex-shrink:0}
.chat-pinned-text{min-width:0;font-size:.82rem;display:flex;flex-direction:column;line-height:1.3}
.chat-pinned-text b{color:var(--accent);font-size:.72rem}
.chat-pinned-text span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
.chat-pinned-actions{display:flex;gap:2px;flex-shrink:0}
.chat-msg.pinned .chat-bubble{box-shadow:inset 2px 0 0 var(--accent)}
.chat-flash{animation:chatFlash 1.5s ease-out}
@keyframes chatFlash{0%{background:color-mix(in srgb,var(--accent) 30%,transparent)}100%{background:transparent}}
/* Reply quote (inside a message + above the composer) */
.chat-reply-quote{border-left:2px solid var(--accent);padding:2px 8px;margin-bottom:4px;cursor:pointer;font-size:.8rem;background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:0 var(--radius) var(--radius) 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-reply-quote b{color:var(--accent);margin-right:6px}
.chat-reply-quote span{color:var(--fg3)}
.chat-msg.mine .chat-reply-quote{border-left-color:rgba(255,255,255,.7);background:rgba(255,255,255,.15)}
.chat-msg.mine .chat-reply-quote b{color:#fff}
.chat-msg.mine .chat-reply-quote span{color:rgba(255,255,255,.85)}
.chat-reply-bar{display:flex;align-items:center;gap:8px;padding:8px 20px 0}
.chat-reply-bar-info{flex:1;min-width:0;border-left:2px solid var(--accent);padding-left:10px;font-size:.8rem;display:flex;flex-direction:column;line-height:1.3}
.chat-reply-bar-info b{color:var(--accent);font-size:.72rem}
.chat-reply-bar-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg3)}
/* Reactions */
.chat-reactions{display:flex;flex-wrap:wrap;gap:4px}
.chat-msg.mine .chat-reactions{justify-content:flex-end}
.chat-react-chip{background:var(--bg3);border:1px solid var(--bg4);border-radius:999px;padding:1px 9px;font-size:.8rem;cursor:pointer;color:var(--fg2);line-height:1.5}
.chat-react-chip:hover{border-color:var(--accent)}
.chat-react-chip.mine{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--fg)}

.wiki-drawio-overlay{z-index:200}
.wiki-drawio-modal{position:fixed;inset:3%;background:var(--bg);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5)}

#wiki-dgm-frame{flex:1;border:0;width:100%;background:#fff}
.wiki-backlinks{max-width:860px;margin:28px 0 0;padding-top:14px;border-top:1px solid var(--bg4)}

.wiki-comments-section{max-width:860px;margin:28px 0 0;padding-top:14px;border-top:1px solid var(--bg4)}

.wiki-comment{padding:8px 0;border-bottom:1px solid var(--bg3)}

.wiki-comment-form{display:flex;gap:8px;margin-top:12px;align-items:flex-start}

.wiki-react-pop button{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:2px 4px;border-radius:4px}

@media print{
  body *{visibility:hidden !important}
  .wiki-title,.wiki-title *,.wiki-content,.wiki-content *{visibility:visible !important}
  .wiki-title{position:absolute;top:0;left:0;color:#000}
  .wiki-content{position:absolute;top:36px;left:0;width:100%;max-width:none;color:#000}
  .wiki-actions,.wiki-menu-wrap,.wiki-comments-section,.wiki-backlinks{display:none !important}
}
.wiki-info,.wiki-warn,.wiki-note,.wiki-success{padding:10px 14px;border-radius:var(--radius);margin:.7em 0;border-left:3px solid}
.wiki-info{background:color-mix(in srgb, var(--accent) 12%, var(--bg2));border-color:var(--accent)}
.wiki-warn{background:color-mix(in srgb, var(--red) 12%, var(--bg2));border-color:var(--red)}
.wiki-note{background:var(--bg2);border-color:var(--fg3)}
.wiki-success{background:color-mix(in srgb, var(--green) 12%, var(--bg2));border-color:var(--green)}
.md-content details{border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 12px;margin:.7em 0;background:var(--bg2)}
.md-content details>summary{cursor:pointer;font-weight:600;color:var(--fg);list-style-position:inside}
.md-content details[open]>summary{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--bg4)}
.wiki-subpages{margin:.8em 0;padding:8px 14px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius)}
.wiki-toc-list{margin:0;padding-left:1.4em;list-style:disc}
.wiki-toc-list .wiki-toc-list{margin:2px 0 4px}
.wiki-toc-link{color:var(--accent);text-decoration:none;cursor:pointer}
.wiki-toc-link:hover{text-decoration:underline}
.wiki-toc-empty{color:var(--fg3);font-size:.85rem}
.wiki-summary{margin:.6em 0 1em;padding:10px 14px;border-radius:var(--radius);border-left:3px solid var(--accent2);background:color-mix(in srgb, var(--accent2) 10%, var(--bg2))}
.wiki-summary-head{font-size:.8rem;font-weight:600;color:var(--accent2);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.wiki-summary-cached{font-weight:400;font-size:.72rem;color:var(--fg3);background:var(--bg3);border-radius:8px;padding:1px 7px}
.wiki-summary-body{font-size:.92rem;line-height:1.55}
.wiki-summary-err{border-left-color:var(--red);background:color-mix(in srgb, var(--red) 10%, var(--bg2));color:var(--red);font-size:.85rem}
.wiki-empty{padding:14px;color:var(--fg3);font-size:.85rem;text-align:center}
.wiki-empty-lg{padding-top:12vh}
.wiki-title-input{width:100%;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:10px 14px;color:var(--fg);font-size:1.4rem;font-weight:600;margin-bottom:8px}
.wiki-title-input:focus{outline:none;border-color:var(--accent)}
.wiki-toolbar{display:flex;gap:2px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius) var(--radius) 0 0;padding:6px;position:sticky;top:0;z-index:10}
.wiki-tb-btn{background:none;border:none;color:var(--fg2);min-width:30px;height:28px;border-radius:var(--radius);cursor:pointer;font-size:.85rem;padding:0 6px}

.wiki-tb-sep{width:1px;background:var(--bg4);margin:2px 4px}
.wiki-editor{min-height:50vh;background:var(--bg);border:1px solid var(--bg4);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:16px 20px;outline:none;max-width:none;line-height:1.65;position:relative}

.wiki-edit-footer{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.wiki-comment-input{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:8px 12px;color:var(--fg);font-size:.82rem}
.wiki-menu-wrap{position:relative}
.wiki-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);min-width:190px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.35);overflow:hidden}

.wiki-menu a{display:block;padding:8px 14px;font-size:.84rem;color:var(--fg);cursor:pointer;text-decoration:none}

.wiki-history{display:flex;gap:18px;align-items:flex-start}
.wiki-rev-list{width:280px;min-width:280px;display:flex;flex-direction:column;gap:6px}

.wiki-rev-item.active{border-color:var(--accent);background:var(--bg3)}
.wiki-rev-current{font-size:.7rem;color:var(--green);margin-left:6px}
.wiki-rev-meta{color:var(--fg3);font-size:.74rem;margin-top:2px}
.wiki-rev-comment{color:var(--fg2);font-size:.76rem;margin-top:4px;font-style:italic}
.wiki-rev-view{flex:1;min-width:0}
.wiki-rev-view-head{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:.85rem;color:var(--fg2)}
.wiki-rev-comparebar{display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--bg4);margin-bottom:2px}
.wiki-rev-comparehint{color:var(--fg3);font-size:.72rem}
.wiki-rev-row1{display:flex;align-items:center;gap:7px}
.wiki-rev-cb{width:auto;margin:0;cursor:pointer;flex-shrink:0}
.wiki-diff{font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.5;border:1px solid var(--bg4);border-radius:var(--radius);overflow:auto;background:var(--bg)}
.wiki-diff-line{display:flex;gap:6px;padding:0 10px;white-space:pre-wrap;word-break:break-word}
.wiki-diff-sym{flex-shrink:0;width:1ch;text-align:center;color:var(--fg3);user-select:none}
.wiki-diff-txt{flex:1;min-width:0}
.wiki-diff-add{background:color-mix(in srgb, var(--green) 16%, var(--bg))}
.wiki-diff-add .wiki-diff-sym{color:var(--green)}
.wiki-diff-del{background:color-mix(in srgb, var(--red) 16%, var(--bg))}
.wiki-diff-del .wiki-diff-sym{color:var(--red)}
.wiki-settings{max-width:560px}
.wiki-settings label{display:block;margin-bottom:10px;font-size:.85rem;color:var(--fg2)}
.wiki-settings label input,.wiki-settings label select{display:block;width:100%;margin-top:4px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:8px 12px;color:var(--fg);font-size:.86rem}
.wiki-settings h3{margin:14px 0 8px}
.wiki-settings .entity-item{gap:8px}
.wiki-settings .entity-item select,.wiki-settings .entity-add select{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 8px;color:var(--fg);font-size:.82rem}
.wiki-settings .entity-add select{flex:1;min-width:0}
.wiki-settings .entity-add select+select{flex:none}
.wiki-owner-badge{font-size:.78rem;color:var(--fg3);white-space:nowrap}
.wiki-members-hint{font-size:.8rem;color:var(--fg3);line-height:1.4;margin-bottom:10px}
.header h1 a{color:inherit;text-decoration:none}
.header-actions{display:flex;gap:8px;align-items:center}
.hdr-sep{color:var(--fg3);margin:0 4px;font-family:'JetBrains Mono',monospace;font-size:1.1rem;user-select:none}
.hdr-filter{position:relative;display:inline-flex;align-items:center}
.hdr-filter-name{color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:1.1rem;cursor:pointer;transition:color .15s;white-space:nowrap}
.hdr-filter-name:hover{color:var(--accent2)}
.hdr-filter-dropdown{position:absolute;top:100%;left:0;margin-top:6px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);min-width:180px;z-index:200;padding:4px 0;max-height:calc(6 * 36px + 8px);overflow-y:auto}
.hdr-filter-dropdown .sfd-item{padding:7px 14px;cursor:pointer;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.hdr-filter-dropdown .sfd-item:hover{background:var(--bg4)}
.hdr-filter-dropdown .sfd-item.active{color:var(--accent2);font-weight:600}
.header-spacer{height:52px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;font-family:inherit;font-weight:600;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--fg2);border:1px solid var(--bg4)}
.btn-ghost:hover{background:var(--bg3);color:var(--fg)}
.btn-danger{background:transparent;color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.15)}
.btn-sm{padding:4px 10px;font-size:.8rem}
.btn-icon{padding:4px 8px;background:transparent;border:none;color:var(--fg3);cursor:pointer;border-radius:var(--radius)}
.btn-icon:hover{color:var(--fg);background:var(--bg4)}

.board{display:flex;gap:16px;padding:20px 24px;min-height:calc(100vh - 52px);align-items:flex-start;overflow-x:auto}
.column{background:var(--bg2);border-radius:var(--radius-lg);width:var(--col-w);min-width:var(--col-w);flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 90px)}
.col-header{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px;border-bottom:1px solid var(--bg3)}

.col-count{background:var(--bg4);color:var(--fg2);font-size:.75rem;padding:1px 7px;border-radius:10px;font-weight:600}

.col-body::-webkit-scrollbar{width:4px}
.col-body::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

.card{background:var(--bg3);border-radius:var(--radius);padding:10px 12px;cursor:grab;border:1px solid transparent;transition:all .15s;position:relative}
.card:hover{border-color:var(--bg4);box-shadow:var(--shadow)}
.card.dragging{opacity:.5;border-color:var(--accent)}
.card-title{font-weight:600;font-size:.88rem;margin-bottom:4px;line-height:1.3}
.card-id{font-size:.7rem;color:var(--fg3);font-family:'JetBrains Mono',monospace}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
.card-epic{font-size:.72rem;padding:2px 8px;border-radius:10px;font-weight:600;cursor:pointer}
.card-tag{font-size:.7rem;padding:1px 7px;border-radius:8px;font-weight:600;opacity:.85}
.card-priority{width:3px;height:100%;position:absolute;left:0;top:0;border-radius:var(--radius) 0 0 var(--radius)}
.priority-1{background:var(--blue)}
.priority-2{background:var(--green)}
.priority-3{background:var(--orange)}
.priority-4{background:var(--red)}
.card-comments{font-size:.75rem;color:var(--fg3);display:flex;align-items:center;gap:3px}
.card-todo{font-size:.72rem;color:var(--fg3);display:flex;align-items:center;gap:3px}
.card-link{font-size:.72rem;color:var(--accent2);display:flex;align-items:center;gap:2px}
.card-assignee{font-size:.72rem;color:var(--accent2);display:flex;align-items:center;gap:2px;background:var(--bg4);padding:1px 6px;border-radius:8px}
.card-private{font-size:.72rem;color:var(--orange);display:flex;align-items:center;gap:2px}
.col-add-btn{background:transparent;border:1px solid var(--bg4);border-radius:var(--radius);color:var(--fg3);cursor:pointer;font-size:.9rem;width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;line-height:1}
.col-add-btn:hover{border-color:var(--accent);color:var(--accent2)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal{background:var(--bg2);border-radius:var(--radius-lg);width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.5);padding:12px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bg3)}
.modal-header h2{font-size:1rem}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--bg3)}
/* App-styled dialogs (replacing native alert/confirm/prompt) */
.modal-narrow{width:400px;padding:0}
.ui-dialog-body{padding:20px;font-size:.92rem;line-height:1.5;color:var(--fg);white-space:pre-wrap;word-break:break-word}
.ui-dialog-input{width:100%;margin-top:12px;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:9px 12px;color:var(--fg);font-family:inherit;font-size:.9rem;outline:none}
.ui-dialog-input:focus{border-color:var(--accent)}
.ui-dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}
/* Toasts */
.toast-container{position:fixed;top:64px;right:16px;z-index:500;display:flex;flex-direction:column;gap:8px;max-width:360px;pointer-events:none}
[dir="rtl"] .toast-container{right:auto;left:16px}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:9px;background:var(--bg2);border:1px solid var(--bg4);border-left:3px solid var(--accent);border-radius:var(--radius);box-shadow:0 6px 24px rgba(0,0,0,.35);padding:10px 13px;font-size:.85rem;line-height:1.4;color:var(--fg);cursor:pointer;word-break:break-word;animation:toastIn .18s ease-out}
.toast.toast-out{animation:toastOut .2s ease-in forwards}
.toast-success{border-left-color:var(--green)}
.toast-error{border-left-color:var(--red)}
.toast-info{border-left-color:var(--blue)}
.toast-ico{flex-shrink:0;font-weight:700}
.toast-success .toast-ico{color:var(--green)}
.toast-error .toast-ico{color:var(--red)}
.toast-info .toast-ico{color:var(--blue)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.lightbox-overlay img{max-width:calc(100vw - 40px);max-height:calc(100vh - 40px);object-fit:contain;border-radius:var(--radius-lg);box-shadow:0 4px 30px rgba(0,0,0,.6)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;color:var(--fg2);font-weight:600}
.field input,.field textarea,.field select{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:8px 10px;color:var(--fg);font-family:inherit;font-size:.88rem;outline:none;transition:border .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px;font-family:'JetBrains Mono',monospace;font-size:.82rem}
.field select{cursor:pointer}
.field-row{display:flex;gap:12px}
.field-row .field{flex:1}
.checkbox-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .15s;opacity:.6}
.chip.selected{opacity:1;border-color:#fff3}
.chip:hover{opacity:.9}

.md-toolbar{display:flex;gap:2px;padding:4px;background:var(--bg4);border-radius:var(--radius) var(--radius) 0 0;flex-wrap:wrap}
.md-toolbar button{background:transparent;border:none;color:var(--fg2);padding:3px 8px;border-radius:3px;cursor:pointer;font-size:.78rem;font-family:'JetBrains Mono',monospace;font-weight:600;transition:all .1s}
.md-toolbar button:hover{background:var(--accent);color:#fff}
.md-toolbar+textarea{border-radius:0 0 var(--radius) var(--radius)!important}

.md-content{font-size:.9rem;line-height:1.6;color:var(--fg2);padding:10px 14px;background:var(--bg3);border-radius:var(--radius);min-height:40px;overflow-wrap:break-word}
.md-content:empty::before{content:attr(data-empty);color:var(--fg3)}
.md-content h1,.md-content h2,.md-content h3{color:var(--fg);margin:8px 0 4px;font-size:1rem}
.md-content h1{font-size:1.15rem}
.md-content h2{font-size:1.05rem}
.md-content p{margin:4px 0}
.md-content ul,.md-content ol{margin:4px 0 4px 20px}
.md-content li{margin:2px 0}
.md-content code{background:var(--bg4);padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:.82rem}
.md-content pre{background:var(--bg4);padding:10px;border-radius:var(--radius);overflow-x:auto;margin:6px 0}
.md-content pre code{background:none;padding:0}
.md-content img{max-width:100%;border-radius:var(--radius);margin:6px 0;cursor:zoom-in}
.md-content blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--fg3);margin:6px 0}
.md-content input[type="checkbox"]{margin-right:6px;accent-color:var(--accent);cursor:pointer}
.md-content a{color:var(--accent2)}
.md-content details{background:var(--bg4);border-radius:var(--radius);padding:8px 12px;margin:6px 0}
.md-content details summary{cursor:pointer;font-weight:600;color:var(--fg);user-select:none}
.md-content details summary:hover{color:var(--accent2)}

/* mention highlighting */
.mention{color:var(--accent2);font-weight:600;cursor:pointer}

.task-page{max-width:800px;margin:0 auto;padding:30px 24px}
.task-page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.task-page-header h2{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.task-page-header .task-id-badge{font-size:.85rem;color:var(--fg3);font-family:'JetBrains Mono',monospace}
.task-page-body{display:flex;flex-direction:column;gap:16px}
.task-page-sidebar-info{display:flex;flex-wrap:wrap;gap:12px;padding:14px;background:var(--bg2);border-radius:var(--radius-lg);margin-bottom:8px}
.task-info-item{display:flex;flex-direction:column;gap:3px;min-width:120px}
.task-info-item label{font-size:.72rem;color:var(--fg3);text-transform:uppercase;font-weight:600;letter-spacing:.04em}
.task-info-item .value{font-size:.88rem;color:var(--fg)}
.task-page-section{background:var(--bg2);border-radius:var(--radius-lg);padding:16px 20px}
.task-page-section h3{font-size:.9rem;margin-bottom:10px;color:var(--fg2)}
.task-dates{font-size:.72rem;color:var(--fg3);display:flex;gap:16px}

.todo-list{display:flex;flex-direction:column;gap:4px}
.todo-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg3);border-radius:var(--radius);transition:all .15s}
.todo-item:hover{background:var(--bg4)}
.todo-item input[type="checkbox"]{accent-color:var(--accent);cursor:pointer;width:16px;height:16px;flex-shrink:0}
.todo-item .todo-text{flex:1;font-size:.88rem}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--fg3)}
.todo-item .btn-icon{opacity:0;transition:opacity .15s}
.todo-item:hover .btn-icon{opacity:1}
.todo-add{display:flex;gap:6px;margin-bottom:8px}
.todo-add input{flex:1;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 10px;color:var(--fg);font-family:inherit;font-size:.85rem;outline:none}
.todo-add input:focus{border-color:var(--accent)}

.epic-page{max-width:900px;margin:0 auto;padding:30px 24px}
.epic-page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.epic-page-header h2{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.epic-task-list{display:flex;flex-direction:column;gap:6px}
.epic-task-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg3);border-radius:var(--radius);cursor:pointer;transition:all .15s}
.epic-task-row:hover{background:var(--bg4)}
.epic-task-status{padding:2px 10px;border-radius:10px;font-size:.75rem;font-weight:600;background:var(--bg4);color:var(--fg2)}
.epic-task-title{flex:1;font-size:.9rem;font-weight:600}
.epic-task-prio{font-size:.75rem;font-weight:600}

.search-input{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 10px;color:var(--fg);font-family:inherit;font-size:.85rem;outline:none;width:240px;transition:border .15s}
.search-wrap{display:flex;align-items:center;gap:0}
.search-scope{background:var(--bg3);border:1px solid var(--bg4);border-right:none;border-radius:var(--radius) 0 0 var(--radius);color:var(--fg2);font-size:.78rem;padding:6px 4px;outline:none;max-width:96px}
.search-wrap .search-input{border-radius:0 var(--radius) var(--radius) 0}
[dir="rtl"] .search-scope{border-radius:0 var(--radius) var(--radius) 0;border-right:1px solid var(--bg4);border-left:none}
[dir="rtl"] .search-wrap .search-input{border-radius:var(--radius) 0 0 var(--radius)}
/* hide kanban-only header controls outside kanban views */
/* Hide ONLY the kanban sprint/epic filters (direct children of h1) outside the
   board — not the service selectors nested inside the per-service header slots. */
body:not(.kanban-view) h1 > .hdr-filter,
body:not(.kanban-view) h1 > .hdr-sep,
body:not(.kanban-view) .hdr-kanban-only{display:none !important}
body:not(.view-mail) .hdr-mail-only{display:none !important}
body:not(.view-wiki) .hdr-wiki-only{display:none !important}
body:not(.view-calendar) .hdr-cal-only{display:none !important}
/* === Admin page === */
#admin-page{display:none;position:fixed;top:52px;left:0;right:0;bottom:0;overflow-y:auto;background:var(--bg);z-index:90}
body.has-rail #admin-page{left:52px}
[dir="rtl"] body.has-rail #admin-page{left:0;right:52px}
body.view-admin #admin-page{display:block}
.admin-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:14px 24px 0;border-bottom:1px solid var(--bg4);position:sticky;top:0;background:var(--bg);z-index:1}
.admin-tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--fg2);cursor:pointer;font-size:.88rem;padding:8px 12px}
.admin-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.admin-body{padding:20px 24px 60px;max-width:900px}
.admin-panel{display:none}
.admin-panel.active{display:block}
.admin-panel .sidebar-section{margin-bottom:24px}
.admin-h{font-size:1.2rem;margin:0 0 16px}
.admin-form{display:flex;flex-direction:column;gap:12px;max-width:560px}
.audit-filters{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.audit-table{overflow-x:auto}
.audit-tbl{border-collapse:collapse;width:100%;font-size:.84rem}
.audit-tbl th,.audit-tbl td{border-bottom:1px solid var(--bg4);padding:6px 10px;text-align:left;vertical-align:top}
.audit-tbl th{color:var(--fg3);font-weight:600}
.audit-tbl code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:.92em}
.admin-empty{color:var(--fg3);padding:10px 0}
.task-llm-result{border:1px solid var(--accent);border-radius:var(--radius);padding:10px 12px;background:color-mix(in srgb,var(--accent) 7%,var(--bg2));display:flex;flex-direction:column;gap:10px}
.llm-draft-bar{display:flex;align-items:center;justify-content:space-between}
.llm-draft-title{font-size:.85rem;font-weight:600;color:var(--accent2)}
.llm-draft-block{display:flex;flex-direction:column;gap:4px}
.llm-draft-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--fg2)}
.llm-draft-actions{display:flex;gap:4px}
.llm-draft-text{width:100%;resize:vertical;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);color:var(--fg);padding:8px 10px;font-size:.85rem;font-family:inherit}
.twofa-secret{font-family:'JetBrains Mono',monospace;font-size:1.1rem;letter-spacing:2px;background:var(--bg3);padding:8px 12px;border-radius:var(--radius);user-select:all;display:inline-block}
.twofa-codes{font-family:'JetBrains Mono',monospace;background:var(--bg3);padding:10px 14px;border-radius:var(--radius);user-select:all}
.onboarding-overlay{z-index:400}
.onboarding-modal{max-width:560px}
.onboarding-opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ob-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit}
.ob-opt:hover{border-color:var(--accent);background:var(--bg3)}
.ob-opt b{font-size:.95rem}
.ob-opt span{font-size:.82rem;color:var(--fg3)}
.ob-svc{display:block;margin:4px 0;font-size:.9rem}
#tour-overlay{position:fixed;inset:0;z-index:500;pointer-events:none}
.tour-ring{position:fixed;border-radius:8px;box-shadow:0 0 0 3px var(--accent),0 0 0 9999px rgba(0,0,0,.6);transition:all .2s ease}
.tour-pop{position:fixed;z-index:501;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:14px;pointer-events:auto;max-width:320px}
.tour-text{font-size:.9rem;margin-bottom:10px;line-height:1.5}
.tour-actions{display:flex;align-items:center;gap:8px}
.tour-count{font-size:.78rem;color:var(--fg3);margin-right:auto}
.admin-fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--fg2)}
.admin-fld input,.admin-fld textarea,.admin-mb-add input,.admin-mb-add select{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:8px 10px;color:var(--fg);font-size:.88rem;font-family:inherit}
.admin-hint{color:var(--fg3);font-size:.74rem}
.admin-row{display:flex;gap:8px}
.admin-note{color:var(--fg3);font-size:.82rem;padding:8px 0}
.admin-code{font-family:'JetBrains Mono',monospace;font-size:.76rem;word-break:break-all}
.admin-danger{color:var(--red) !important}
.admin-mb-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.admin-inline{display:flex;align-items:center;gap:4px;font-size:.82rem;color:var(--fg2)}
.admin-table{width:100%;border-collapse:collapse;font-size:.82rem}
.admin-table th{text-align:left;color:var(--fg3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--bg4)}
.admin-table td{padding:6px 8px;border-bottom:1px solid var(--bg3);vertical-align:top}
.admin-audit{overflow-x:auto}
.admin-ev{font-size:.72rem;padding:1px 6px;border-radius:8px;background:var(--bg3)}
.admin-ev-inbound_reject,.admin-ev-spam,.admin-ev-relay_attempt{background:color-mix(in srgb,var(--red) 25%,transparent)}
.admin-ev-inbound_accept{background:color-mix(in srgb,var(--green) 22%,transparent)}
@media (max-width:760px){ body.has-rail #admin-page{left:0;bottom:50px} }
.search-input:focus{border-color:var(--accent);width:300px}
.search-results{position:fixed;top:52px;left:0;right:0;z-index:99;background:var(--bg2);border-bottom:1px solid var(--bg4);padding:12px 24px;max-height:60vh;overflow-y:auto;box-shadow:var(--shadow)}
/* Clear the app rail so results don't slide under it (mirrors #app's margin). */
body.has-rail .search-results{left:52px}
[dir="rtl"] body.has-rail .search-results{left:0;right:52px}
.search-result-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);border-radius:var(--radius);cursor:pointer;margin-bottom:4px;transition:all .15s}
.search-result-item:hover{background:var(--bg4)}

.sidebar{position:fixed;right:0;top:52px;width:360px;height:calc(100vh - 52px);background:var(--bg2);border-left:1px solid var(--bg4);z-index:150;transform:translateX(100%);transition:transform .25s;padding:20px;overflow-y:auto}
.sidebar.open{transform:translateX(0)}
.sidebar h3{font-size:.95rem;margin-bottom:12px}
.sidebar-section{margin-bottom:24px}
.entity-list{display:flex;flex-direction:column;gap:6px;max-height:calc(6 * 42px);overflow-y:auto}
.entity-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg3);border-radius:var(--radius)}
.svc-ctrls{display:inline-flex;align-items:center;gap:4px}
.svc-ctrls button[disabled]{opacity:.3;cursor:default}
.entity-item .dot{width:12px;height:12px;max-width:12px;min-width:12px;min-height:12px;border-radius:50%;margin-right:8px;flex-shrink:0}
.entity-item span{flex:1;font-size:.85rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
.entity-add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.entity-add input{flex:1;min-width:60px;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 8px;color:var(--fg);font-family:inherit;font-size:.82rem;outline:none}
.entity-add input[type="color"]{width:36px;padding:2px;cursor:pointer;flex:none;min-width:36px}

.col-order-item{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg3);border-radius:var(--radius)}
.col-order-item span{flex:1;font-size:.85rem}
.col-order-btns{display:flex;gap:2px}
.col-order-btns button{background:transparent;border:none;color:var(--fg3);cursor:pointer;padding:2px 6px;border-radius:3px;font-size:.85rem}
.col-order-btns button:hover{background:var(--bg4);color:var(--fg)}

.epic-progress{margin-top:4px}
.epic-progress-bar{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-top:3px}
.epic-progress-fill{height:100%;border-radius:2px;transition:width .3s}
.epic-progress-text{font-size:.7rem;color:var(--fg3)}

.theme-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.theme-btn{padding:6px 14px;border-radius:var(--radius);border:2px solid var(--bg4);background:var(--bg3);color:var(--fg);font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s}
.theme-btn:hover{border-color:var(--accent)}
.theme-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}

.font-size-ctrl{display:flex;align-items:center;gap:8px;margin-top:4px}
.font-size-ctrl button{width:32px;height:32px;border-radius:var(--radius);border:1px solid var(--bg4);background:var(--bg3);color:var(--fg);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.font-size-ctrl button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.font-size-ctrl span{font-size:.85rem;color:var(--fg2);min-width:40px;text-align:center}

.project-link{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;color:var(--accent2);padding:4px 10px;background:var(--bg3);border-radius:var(--radius);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.comment-form{display:flex;flex-direction:column;gap:8px}
.comment-form textarea{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:8px 10px;color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:.82rem;outline:none;resize:vertical;min-height:60px}
.comment-form textarea:focus{border-color:var(--accent)}
.comment-form-actions{display:flex;justify-content:space-between;align-items:center}
.paste-hint{font-size:.72rem;color:var(--fg3)}
.comments-list{display:flex;flex-direction:column;gap:8px}
.comment{background:var(--bg3);border-radius:var(--radius);padding:10px 12px}
.comment-author{font-size:.78rem;color:var(--accent2);font-weight:600;margin-bottom:4px}
.comment-text{font-size:.88rem;line-height:1.5}
.comment-text .md-content{padding:0;background:none;min-height:auto}
.comment-time{font-size:.72rem;color:var(--fg3);margin-top:4px;display:flex;justify-content:space-between;align-items:center}

.comment-replies{margin-left:20px;border-left:2px solid var(--bg4);padding-left:12px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.comment-actions{display:flex;gap:6px;align-items:center}
.comment-actions button{background:transparent;border:none;color:var(--fg3);cursor:pointer;font-size:.72rem;padding:2px 6px;border-radius:3px;font-family:inherit}
.comment-actions button:hover{color:var(--accent2);background:var(--bg4)}
.reply-form{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.reply-form textarea{background:var(--bg);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 8px;color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:.8rem;outline:none;resize:vertical;min-height:50px}
.reply-form textarea:focus{border-color:var(--accent)}
.comment-edited{font-size:.68rem;color:var(--fg3);font-style:italic;cursor:help}

.export-import-btns{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.tz-select{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 8px;color:var(--fg);font-family:inherit;font-size:.82rem;outline:none;width:100%;margin-top:4px}
.tz-select:focus{border-color:var(--accent)}

/* Notification badge */
.notif-badge{background:var(--red);color:#fff;font-size:.7rem;padding:1px 5px;border-radius:8px;font-weight:700;margin-left:4px}
.notif-dropdown{position:fixed;right:20px;top:52px;width:380px;max-height:60vh;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius-lg);box-shadow:var(--shadow);z-index:200;overflow-y:auto;padding:12px}
.notif-item{padding:8px 10px;background:var(--bg3);border-radius:var(--radius);margin-bottom:6px;font-size:.82rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.notif-item.unread{border-left-color:var(--accent)}
.notif-item:hover{background:var(--bg4)}
.notif-time{font-size:.7rem;color:var(--fg3);margin-top:4px}

/* User profile page */
.user-page{max-width:800px;margin:0 auto;padding:30px 24px}
.user-page-header{margin-bottom:20px}
.user-page-header h2{font-size:1.3rem}
.activity-list{display:flex;flex-direction:column;gap:6px}
.activity-item{padding:8px 12px;background:var(--bg3);border-radius:var(--radius);font-size:.85rem;display:flex;gap:10px;align-items:center}
.activity-time{font-size:.72rem;color:var(--fg3);white-space:nowrap}
.activity-action{flex:1}

/* Language selector */
.lang-select{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 8px;color:var(--fg);font-family:inherit;font-size:.82rem;outline:none;width:100%;margin-top:4px}

@media(max-width:768px){
  .header{padding:8px 12px;height:48px}
  .header h1{font-size:.95rem}
  .header-spacer{height:48px}
  .search-input{width:140px;font-size:.8rem}
  .search-input:focus{width:180px}
  .board{padding:12px;gap:12px;flex-direction:column;align-items:stretch}
  .column{width:100%;min-width:unset;max-height:none}
  .col-body{max-height:50vh}
  .sidebar{width:100%;right:0;left:0}
  .app-rail{top:auto;bottom:0;left:0;right:0;width:100%;height:50px;flex-direction:row;justify-content:center;border-right:none;border-top:1px solid var(--bg4);padding:0 10px;gap:14px}
  body.has-rail #app{margin-left:0;padding-bottom:58px}
  [dir="rtl"] body.has-rail #app{margin-right:0}
  [dir="rtl"] .app-rail{border-left:none}
  .rail-btn.active::before{left:6px;right:6px;top:auto;bottom:-1px;width:auto;height:3px}
  [dir="rtl"] .rail-btn.active::before{left:6px;right:6px}
  .rail-sep{width:1px;height:26px;margin:0 2px;align-self:center}
  .wiki-layout{flex-direction:column;height:auto}
  .wiki-side{width:100%;min-width:0;max-height:40vh;border-right:none;border-bottom:1px solid var(--bg4)}
  .wiki-main{padding:16px 12px 70px}
  .wiki-history{flex-direction:column}
  .wiki-rev-list{width:100%;min-width:0}
  .modal{width:98vw;max-width:98vw}
  .task-page,.epic-page,.user-page{padding:16px 12px}
  .task-page-header h2,.epic-page-header h2{font-size:1.1rem}
  .task-page-sidebar-info{flex-direction:column}
  .field-row{flex-direction:column}
  .search-results{padding:8px 12px}
  body.has-rail .search-results{left:0;right:0}
  .lightbox-overlay{padding:8px}
  .lightbox-overlay img{max-width:calc(100vw - 16px);max-height:calc(100vh - 16px)}
  .comment-replies{margin-left:12px;padding-left:8px}
  .epic-page-header{flex-direction:column;align-items:flex-start}
  .task-page-header{flex-direction:column;align-items:flex-start}
  .theme-list{gap:6px}
  .theme-btn{padding:4px 10px;font-size:.78rem}
  .md-toolbar{gap:1px}
  .md-toolbar button{padding:3px 5px;font-size:.72rem}
  .notif-dropdown{width:calc(100vw - 20px);right:10px}
}
@media(max-width:480px){
  .header-actions{gap:4px}
  .search-input{width:100px}
  .search-input:focus{width:140px}
  .card-meta{gap:3px}
  .btn-sm{padding:3px 8px;font-size:.75rem}
  .col-body{max-height:40vh}
}
.card-deadline{width:8px;height:8px;border-radius:50%;background:var(--fg3);display:inline-block;cursor:help;position:relative;flex-shrink:0}
.card-deadline.soon{background:var(--orange)}
.card-deadline.overdue{background:var(--red)}
.deadline-popup{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 10px;font-size:.75rem;color:var(--fg);white-space:nowrap;z-index:50;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .15s}
.card-deadline:hover .deadline-popup{opacity:1}
.dep-search-wrap{position:relative}
.dep-search-input{width:100%;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 8px;color:var(--fg);font-family:inherit;font-size:.85rem;outline:none}
.dep-search-input:focus{border-color:var(--accent)}
.dep-list{max-height:120px;overflow-y:auto;border:1px solid var(--bg4);border-radius:var(--radius);background:var(--bg3);margin-top:4px}
.dep-list-item{padding:4px 8px;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.dep-list-item:hover{background:var(--bg4)}
.dep-list-item input{accent-color:var(--accent)}
.dep-selected{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.dep-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--bg4);border-radius:10px;font-size:.78rem;color:var(--fg2)}
.dep-chip button{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:.75rem;padding:0 2px}
.dep-chip button:hover{color:var(--red)}
.hidden{display:none!important}

/* RTL support */
[dir="rtl"] body{direction:rtl;text-align:right}
[dir="rtl"] .header{flex-direction:row-reverse}
[dir="rtl"] .header-actions{flex-direction:row-reverse}
[dir="rtl"] .board{direction:rtl}
[dir="rtl"] .card-priority{left:auto;right:0;border-radius:0 var(--radius) var(--radius) 0}
[dir="rtl"] .sidebar{right:auto;left:0;border-left:none;border-right:1px solid var(--bg4);transform:translateX(-100%)}
[dir="rtl"] .sidebar.open{transform:translateX(0)}
[dir="rtl"] .comment-replies{margin-left:0;margin-right:20px;border-left:none;border-right:2px solid var(--bg4);padding-left:0;padding-right:12px}
[dir="rtl"] .task-page-header,.epic-page-header{flex-direction:row-reverse}
[dir="rtl"] .col-header{flex-direction:row-reverse}
[dir="rtl"] .card-meta{flex-direction:row-reverse}
[dir="rtl"] .entity-item{flex-direction:row-reverse}
[dir="rtl"] .modal-header{flex-direction:row-reverse}
[dir="rtl"] .modal-footer{flex-direction:row-reverse}
[dir="rtl"] .comment-time{flex-direction:row-reverse}
[dir="rtl"] .comment-actions{flex-direction:row-reverse}
[dir="rtl"] .notif-dropdown{right:auto;left:20px}
</style>
</head>
<body>

<div class="header">
  <h1>
    <a href="/" onclick="resetBoardFilters();navigateTo('/');return false;">&#x2B21; __APP_NAME__</a>
    <span id="project-hdr"></span>
    <span class="hdr-sep">/</span>
    <span class="hdr-filter">
      <span class="hdr-filter-name" id="sprint-filter-label" onclick="toggleSprintFilter(event)">ALL</span>
      <div class="hdr-filter-dropdown hidden" id="sprint-filter-dropdown"></div>
    </span>
    <span class="hdr-sep">/</span>
    <span class="hdr-filter">
      <span class="hdr-filter-name" id="epic-filter-label" onclick="toggleEpicFilter(event)">ALL</span>
      <div class="hdr-filter-dropdown hidden" id="epic-filter-dropdown"></div>
    </span>
    <span class="hdr-mail-only" id="mail-hdr"></span>
    <span class="hdr-wiki-only" id="wiki-hdr"></span>
    <span class="hdr-cal-only" id="cal-hdr"></span>
  </h1>
  <div class="header-actions">
    <span class="search-wrap">
      <select class="search-scope" id="search-scope" onchange="onSearchScopeChange()" title="Search scope"></select>
      <input class="search-input" id="search" autocomplete="off">
    </span>
    <button class="btn btn-ghost btn-sm hdr-kanban-only" id="backlog-btn" onclick="navigateTo('/backlog')" data-i18n="sprintBacklog" style="font-size:.8rem"></button>
    <button class="btn btn-ghost btn-sm" id="help-btn" onclick="restartTour()" title="Help / Тур">?</button>
    <button class="btn btn-ghost btn-sm" id="notif-btn" onclick="toggleNotifications()" style="position:relative">&#128276;<span id="notif-count" class="notif-badge hidden">0</span></button>
    <button class="btn btn-ghost btn-sm hdr-kanban-only" id="personal-toggle" onclick="togglePersonalView()" style="display:none"></button>
  </div>
</div>
<div class="header-spacer"></div>
<div id="notif-dropdown" class="notif-dropdown hidden"></div>
<div id="search-results" class="search-results hidden"></div>
<nav class="app-rail" id="app-rail"></nav>
<div id="app"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-section" id="theme-section">
    <h3 data-i18n="theme"></h3>
    <div class="theme-list" id="theme-list">
      <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">&#9790;</button>
      <button class="theme-btn" data-theme="light" onclick="setTheme('light')">&#9788;</button>
      <button class="theme-btn" data-theme="ocean" onclick="setTheme('ocean')">Ocean</button>
      <button class="theme-btn" data-theme="forest" onclick="setTheme('forest')">Forest</button>
      <button class="theme-btn" data-theme="nord" onclick="setTheme('nord')">Nord</button>
      <button class="theme-btn" data-theme="dracula" onclick="setTheme('dracula')">Dracula</button>
      <button class="theme-btn" data-theme="solarized" onclick="setTheme('solarized')">Solarized</button>
      <button class="theme-btn" data-theme="spacedust" onclick="setTheme('spacedust')">Spacedust</button>
    </div>
  </div>
  <div class="sidebar-section" id="lang-section">
    <h3 data-i18n="language"></h3>
    <select class="lang-select" id="lang-select" onchange="setLang(this.value)"></select>
  </div>
  <div class="sidebar-section" id="fontsize-section">
    <h3 data-i18n="fontSize"></h3>
    <div class="font-size-ctrl">
      <button onclick="changeFontSize(-1)">-</button>
      <span id="font-size-label">14px</span>
      <button onclick="changeFontSize(1)">+</button>
    </div>
  </div>
  <div class="sidebar-section" id="columns-section" style="display:none">
    <h3 data-i18n="columns"></h3>
    <div class="entity-list" id="col-order-list"></div>
    <div class="entity-add" style="margin-top:8px">
      <input type="text" id="new-col-name" onkeydown="if(event.key==='Enter')addColumn()">
      <button class="btn btn-primary btn-sm" onclick="addColumn()">+</button>
    </div>
  </div>
  <div class="sidebar-section" id="epics-section">
    <h3 data-i18n="epics"></h3>
    <div class="entity-list" id="epic-list"></div>
    <div class="entity-add" id="epic-add-form" style="display:none">
      <input type="color" id="epic-color" value="#6366f1">
      <input type="text" id="epic-name" onkeydown="if(event.key==='Enter')addEpic()">
      <button class="btn btn-primary btn-sm" onclick="addEpic()">+</button>
    </div>
  </div>
  <div class="sidebar-section" id="sprints-section">
    <h3 data-i18n="sprints"></h3>
    <div class="entity-list" id="sprint-list"></div>
    <div class="entity-add" id="sprint-add-form" style="display:none">
      <input type="text" id="sprint-name" style="min-width:120px" onkeydown="if(event.key==='Enter')addSprint()">
      <button class="btn btn-primary btn-sm" onclick="addSprint()">+</button>
    </div>
  </div>
  <div class="sidebar-section" id="tags-section">
    <h3 data-i18n="tags"></h3>
    <div class="entity-list" id="tag-list"></div>
    <div class="entity-add" id="tag-add-form" style="display:none">
      <input type="color" id="tag-color" value="#64748b">
      <input type="text" id="tag-name" onkeydown="if(event.key==='Enter')addTag()">
      <button class="btn btn-primary btn-sm" onclick="addTag()">+</button>
    </div>
  </div>
  <div class="sidebar-section" id="services-section" style="display:none">
    <h3 data-i18n="services"></h3>
    <div class="entity-list" id="services-list"></div>
  </div>
  <div class="sidebar-section" id="timezone-section">
    <h3 data-i18n="timezone"></h3>
    <select class="tz-select" id="tz-select" onchange="setTimezone(this.value)"></select>
  </div>
  <div class="sidebar-section" id="mail-rules-section" style="display:none">
    <h3 id="mail-rules-h3"></h3>
    <button class="btn btn-ghost btn-sm" onclick="if(typeof mailRulesDialog==='function')mailRulesDialog()">&#9881; <span id="mail-rules-manage-lbl"></span></button>
  </div>
  <div class="sidebar-section" id="export-import-section" style="display:none">
    <h3 data-i18n="exportImport"></h3>
    <div class="export-import-btns">
      <button class="btn btn-ghost btn-sm" onclick="exportBoard()">&#128229; Export JSON</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">&#128228; Import JSON</button>
      <input type="file" id="import-file" accept=".json,.gz" style="display:none" onchange="importBoard(this)">
    </div>
  </div>
  <div class="sidebar-section" id="backup-section" style="display:none">
    <h3 data-i18n="backups"></h3>
    <div style="margin-bottom:8px">
      <button class="btn btn-ghost btn-sm" onclick="createBackup()">&#128190; <span data-i18n="createBackup"></span></button>
    </div>
    <div id="backup-list"></div>
  </div>
  <div class="sidebar-section" id="telegram-section" style="display:none">
    <h3>Telegram</h3>
    <div id="telegram-content"></div>
  </div>
  <div class="sidebar-section" id="sso-section" style="display:none">
    <h3>SSO</h3>
    <div id="sso-content"></div>
  </div>
  <div class="sidebar-section" id="llm-section" style="display:none">
    <h3 data-i18n="llmTitle"></h3>
    <div id="llm-content"></div>
  </div>
  <div class="sidebar-section" id="db-section" style="display:none">
    <h3 data-i18n="dbTitle"></h3>
    <div id="db-content"></div>
  </div>
  <div class="sidebar-section" id="users-section" style="display:none">
    <h3 data-i18n="users"></h3>
    <div class="entity-list" id="user-list"></div>
    <div class="entity-add" id="add-user-form">
      <input type="text" id="new-user-name" style="min-width:70px">
      <input type="password" id="new-user-pass" style="min-width:70px">
      <select id="new-user-role" style="min-width:70px;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:6px 4px;color:var(--fg);font-size:.82rem">
        <option value="regular" data-i18n-value="regular"></option>
        <option value="readonly" data-i18n-value="readonly"></option>
        <option value="admin" data-i18n-value="admin"></option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="addUser()">+</button>
    </div>
  </div>
  <div class="sidebar-section">
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <span id="current-user-label" style="font-size:.82rem;color:var(--fg2);cursor:pointer" onclick="if(currentUser)navigateTo('/user/'+currentUser.id)"></span>
      <div style="display:flex;gap:4px">
        <button class="btn btn-ghost btn-sm" onclick="changeOwnPassword()" data-i18n="changePassword"></button>
        <button class="btn btn-ghost btn-sm" onclick="logout()" data-i18n="logout"></button>
      </div>
    </div>
  </div>
</div>

// === App-styled dialogs: toasts + uiConfirm/uiPrompt (replace native alert/confirm/prompt) ===
function toast(message, type) {
  let box = document.getElementById('toast-container');
  if (!box) { box = document.createElement('div'); box.id = 'toast-container'; box.className = 'toast-container'; document.body.appendChild(box); }
  const el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  const ico = document.createElement('span');
  ico.className = 'toast-ico';
  ico.textContent = type === 'success' ? '✓' : (type === 'error' ? '✕' : 'ℹ');
  const txt = document.createElement('span');
  txt.textContent = String(message); // text node — no HTML injection
  el.appendChild(ico); el.appendChild(txt);
  box.appendChild(el);
  let gone = false;
  const remove = () => { if (gone) return; gone = true; el.classList.add('toast-out'); setTimeout(() => el.remove(), 220); };
  el.addEventListener('click', remove);
  setTimeout(remove, type === 'error' ? 6000 : 3500);
}
// Native alert is non-returning, so redirect it globally to a toast (errors by default).
window.alert = function (m) { toast(m, 'error'); };

// uiDialog builds a centered modal; resolves via the buttons / Esc / outside click.
function uiDialog({ message, withInput, defaultValue }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    const inputHTML = withInput ? `<input class="ui-dialog-input" id="ui-dialog-input" value="${escAttr(defaultValue || '')}">` : '';
    ov.innerHTML = `<div class="modal modal-narrow">
      <div class="ui-dialog-body">${esc(String(message || ''))}${inputHTML}</div>
      <div class="ui-dialog-foot">
        <button class="btn btn-ghost btn-sm" id="ui-dialog-cancel">${esc(t('cancel'))}</button>
        <button class="btn btn-primary btn-sm" id="ui-dialog-ok">${esc(t('ok'))}</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const input = ov.querySelector('#ui-dialog-input');
    let done = false;
    const close = (val) => { if (done) return; done = true; document.removeEventListener('keydown', onKey, true); ov.remove(); resolve(val); };
    const cancel = () => close(withInput ? null : false);
    const accept = () => close(withInput ? (input ? input.value : '') : true);
    ov.querySelector('#ui-dialog-cancel').addEventListener('click', cancel);
    ov.querySelector('#ui-dialog-ok').addEventListener('click', accept);
    ov.addEventListener('mousedown', e => { if (e.target === ov) cancel(); });
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      else if (e.key === 'Enter' && (!withInput || e.target === input)) { e.preventDefault(); accept(); }
    }
    document.addEventListener('keydown', onKey, true);
    if (input) { input.focus(); input.select(); } else { ov.querySelector('#ui-dialog-ok').focus(); }
  });
}
function uiConfirm(message) { return uiDialog({ message }); }
function uiPrompt(message, defaultValue) { return uiDialog({ message, withInput: true, defaultValue }); }

// === Projects (top-level context: selector + management) ===
async function loadProjects() {
  try { projects = await api('/api/projects'); } catch (e) { projects = []; }
  if (!projects.find(p => p.id === currentProjectId)) {
    currentProjectId = projects[0] ? projects[0].id : 1;
    localStorage.setItem('kanban-project', currentProjectId);
  }
  renderProjectHeader();
}
function currentProject() { return projects.find(p => p.id === currentProjectId) || null; }

// taskRef renders a task reference as KEY-<number> (e.g. "GEN-12") using the
// owning project's key, falling back to #<id> when key/number are unavailable.
function taskRef(task) {
  if (!task) return '';
  if (task.number) {
    const p = projects.find(x => x.id === (task.project_id || currentProjectId)) || currentProject();
    if (p && p.key) return p.key + '-' + task.number;
  }
  return '#' + task.id;
}

function renderProjectHeader() {
  const el = document.getElementById('project-hdr');
  if (!el) return;
  const cur = currentProject();
  const canCreate = currentUser && currentUser.role !== 'readonly';
  const items = projects.map(p =>
    `<div class="sfd-item ${p.id === currentProjectId ? 'active' : ''}" onclick="switchProject(${p.id})">${esc(p.name)}</div>`).join('')
    || `<div class="sfd-item" style="cursor:default">—</div>`;
  const create = canCreate ? `<button class="btn-icon wiki-hdr-btn" onclick="newProjectDialog()" title="${escAttr(t('projectNew'))}">+</button>` : '';
  const settings = (cur && cur.my_role === 'admin') ? `<button class="btn-icon wiki-hdr-btn" onclick="openProjectSettings()" title="${escAttr(t('projectSettings'))}">&#9881;</button>` : '';
  el.innerHTML = `<span class="hdr-sep">/</span>
    <span class="hdr-filter">
      <span class="hdr-filter-name" id="project-label" onclick="hdrDropToggle(event,'project-dd')" title="${escAttr(t('project'))}">${esc(cur ? cur.name : '—')}</span>
      <div class="hdr-filter-dropdown hidden" id="project-dd">${items}</div>
    </span>${create}${settings}`;
}

async function switchProject(id) {
  currentProjectId = Number(id);
  localStorage.setItem('kanban-project', currentProjectId);
  const dd = document.getElementById('project-dd'); if (dd) dd.classList.add('hidden');
  renderProjectHeader();
  // Refresh the active service view for the new project. Kanban needs its board
  // state reloaded; other project-scoped views (calendar, later wiki) re-fetch
  // themselves via renderCurrentView().
  if (KANBAN_VIEWS.includes(currentView)) {
    await loadBoard();
  } else {
    renderCurrentView();
  }
}

async function newProjectDialog() {
  const name = await uiPrompt(t('projectNamePrompt'));
  if (!name || !name.trim()) return;
  try {
    const res = await api('/api/projects', 'POST', { name: name.trim(), visibility: 'restricted' });
    await loadProjects();
    await switchProject(res.id);
  } catch (e) { alert(e.message); }
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);

    new Intl.DateTimeFormat(loc, {timeZone: tz, year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(p => parts[p.type] = p.value);
    return `${parts.year}/${parts.month}/${parts.day} ${parts.hour}:${parts.minute}`;
  }
  catch {
    const parts = {};
    new Intl.DateTimeFormat(loc, {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(p => parts[p.type] = p.value);
    return `${parts.year}/${parts.month}/${parts.day} ${parts.hour}:${parts.minute}`;

function renderMd(text) {
  if (!text) return '';
  if (typeof marked === 'undefined') return esc(text);
  try {
    let processed = text.replace(/<details><summary>(.*?)<\/summary>\n?([\s\S]*?)\n?<\/details>/g,
      function(_, summary, body) { return `<details><summary>${summary}</summary>\n${marked.parse(body.trim())}</details>`; });
    // Highlight @mentions (escape username to prevent XSS)
    processed = processed.replace(/@(\w+)/g, function(_, name) {
      const safeName = esc(name);
      return '<span class="mention" onclick="var uid=getUserIdByName(\'' + safeName + '\');if(uid)navigateTo(\'/user/\'+uid)">@' + safeName + '</span>';
    });
    let html = marked.parse(processed);
    html = html.replace(/<p>\s*<details>/g, '<details>').replace(/<\/details>\s*<\/p>/g, '</details>');
    html = html.replace(/<a\s+href="(?!https?:\/\/|\/|#|mailto:)([^"]+\.[^"]+)"/g, '<a href="https://$1"');
    html = html.replace(/<a\s+href="(https?:\/\/[^"]+)"/g, '<a href="$1" target="_blank" rel="noopener noreferrer"');
    return html;
  } catch { return esc(text); }
}

function countTodos(text) {
  if (!text) return null;
  const all = (text.match(/- \[[ x]\]/gi) || []);
  if (all.length === 0) return null;
  const done = (text.match(/- \[x\]/gi) || []).length;

}
function parseTodoItems(text) {
  if (!text) return [];
  return text.split('\n').filter(l => /^- \[[ x]\]/i.test(l.trim())).map(l => {
    const done = /^- \[x\]/i.test(l.trim());
    const label = l.trim().replace(/^- \[[ x]\]\s*/i, '');

}
function todoItemsToText(items) { return items.map(i => `- [${i.done ? 'x' : ' '}] ${i.label}`).join('\n'); }
// sortTodos keeps pending items on top and moves done items to the end, preserving
// the original order within each group (Array.sort is stable).
function sortTodos(items) { return items.slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0)); }

function epicProgress(epicId) {

  if (epicTasks.length === 0) return { total: 0, done: 0, pct: 0 };
  const lastCol = state.columns.length ? state.columns[state.columns.length - 1] : null;
  const done = lastCol ? epicTasks.filter(t => t.column_id === lastCol.id).length : 0;
  return { total: epicTasks.length, done, pct: Math.round(done / epicTasks.length * 100) };

// === API ===
// Kanban and wiki endpoints are scoped to the current project via a ?project=
// query param (mirrors how wiki passes space_id). By-id endpoints ignore it
// server-side. The calendar is cross-project (it aggregates every accessible
// project's calendars), so its endpoints are NOT listed here.
const _projectScoped = ['/api/board', '/api/columns', '/api/epics', '/api/sprints', '/api/tags', '/api/tasks', '/api/search',
  '/api/wiki/spaces'];
function withProject(path) {
  const base = path.split('?')[0];
  if (!_projectScoped.some(p => base === p || base.startsWith(p + '/'))) return path;
  const sep = path.includes('?') ? '&' : '?';
  return path + sep + 'project=' + encodeURIComponent(currentProjectId);
}
async function api(path, method = 'GET', body = null) {
  path = withProject(path);
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    const text = await r.text();
    if (r.status === 413) throw new Error(t('fileTooLarge'));
    throw new Error(text.startsWith('<') ? `${r.status} ${r.statusText}` : text);
  }
  return r.json();
}

// === Image compression & paste ===
const _imgExts = /\.(jpe?g|png|gif|webp|bmp|tiff?)$/i;
function _isImage(file) {
  if (file.type && file.type.startsWith('image/')) return true;
  if (file.name && _imgExts.test(file.name)) return true;
  return false;
}
function _isGif(file) {
  return file.type === 'image/gif' || (file.name && /\.gif$/i.test(file.name));
}
function _dbg() {
  if (localStorage.getItem('kanban-debug')) console.log('[upload]', ...arguments);
}
async function compressImage(file) {
  if (!_isImage(file) || _isGif(file)) return file;
  if (file.size <= IMG_COMPRESS_THRESHOLD) return file;
  try {
    const bitmap = await createImageBitmap(file);
    const maxDim = IMG_MAX_DIMENSION;
    let { width, height } = bitmap;
    if (width > maxDim || height > maxDim) {
      const ratio = Math.min(maxDim / width, maxDim / height);
      width = Math.round(width * ratio);
      height = Math.round(height * ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
    bitmap.close();
    let q = IMG_INITIAL_QUALITY;
    let blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
    while (blob && blob.size > IMG_TARGET_SIZE && q > IMG_MIN_QUALITY) {
      q -= IMG_QUALITY_STEP;
      blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
    }
    if (!blob) { console.warn('[compress] toBlob failed'); return file; }
    const result = new File([blob], file.name || 'image.jpg', { type: 'image/jpeg' });
    console.log('[compress]', (file.size/1024|0) + 'KB->' + (result.size/1024|0) + 'KB q=' + q.toFixed(2));
    return result;
  } catch(e) {
    console.warn('[compress] error:', e);
    return file;
  }
}
async function uploadImage(file) {
  const compressed = await compressImage(file);
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(',')[1];
      _dbg('sending:', (base64.length/1024).toFixed(0) + 'KB base64, mime:', compressed.type);
      try { const res = await api('/api/images', 'POST', { data: base64, mime: compressed.type || 'image/jpeg' }); resolve(res.url); }
      catch (e) { reject(e); }
    };
    reader.readAsDataURL(compressed);
  });
}
function setupPaste(textarea) {
  textarea.addEventListener('paste', async (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        const pos = textarea.selectionStart;
        const before = textarea.value.substring(0, pos);
        const after = textarea.value.substring(textarea.selectionEnd);
        textarea.value = before + `![${t('uploading')}]()` + after;
        try { const url = await uploadImage(file); textarea.value = before + `![image](${url})` + after; }
        catch (err) { textarea.value = before + after; alert(t('uploadError') + ': ' + err.message); }
        break;
      }
    }
  });
}
