// === Router ===
function navigateTo(path) { history.pushState(null, '', path); route(); }
function route() {
  const path = location.pathname;
  const from = lastPath; // the path we are navigating away from
  lastPath = path;
  const taskMatch = path.match(/^\/task\/(\d+)$/);
  const epicMatch = path.match(/^\/epic\/(\d+)$/);
  const sprintMatch = path.match(/^\/sprint\/(\d+)$/);
  const userMatch = path.match(/^\/user\/(\d+)$/);
  const svcMatch = path.match(/^\/(wiki|chat|calendar|mail)(\/.*)?$/);
  if (svcMatch && isServiceEnabled(svcMatch[1])) {
    prevEpicId = null; prevPath = null;
    currentView = svcMatch[1]; currentServicePath = svcMatch[2] || '';
    currentTaskId = null; currentEpicId = null; currentSprintId = null; currentProfileId = null;
    renderCurrentView();
    return;
  }
  currentServicePath = '';
  if (path === '/admin') {
    prevEpicId = null; prevPath = null;
    currentView = 'admin'; currentTaskId = null; currentEpicId = null; currentSprintId = null; currentProfileId = null;
    renderCurrentView();
    return;
  }
  if (taskMatch) {
    // Remember where we came from so the back button returns to that exact page
    // (board, epic, sprint, backlog, user profile, calendar, search, etc.).
    if (from && from !== path) { prevPath = from; prevEpicId = (currentView === 'epic') ? currentEpicId : null; }
    else { prevPath = null; prevEpicId = null; }
    currentView = 'task'; currentTaskId = Number(taskMatch[1]); currentEpicId = null; currentSprintId = null; currentProfileId = null;
  } else if (epicMatch) {
    prevEpicId = null; prevPath = null;
    currentView = 'epic'; currentEpicId = Number(epicMatch[1]); currentTaskId = null; currentSprintId = null; currentProfileId = null;
  } else if (sprintMatch) {
    prevEpicId = null; prevPath = null;
    currentView = 'sprint'; currentSprintId = Number(sprintMatch[1]); currentTaskId = null; currentEpicId = null; currentProfileId = null;
  } else if (path === '/backlog') {
    prevEpicId = null; prevPath = null;
    currentView = 'backlog'; currentTaskId = null; currentEpicId = null; currentSprintId = null; currentProfileId = null;
  } else if (userMatch) {
    prevEpicId = null; prevPath = null;
    currentView = 'user'; currentProfileId = Number(userMatch[1]); currentTaskId = null; currentEpicId = null; currentSprintId = null;
  } else {
    prevEpicId = null; prevPath = null;
    currentView = 'board'; currentTaskId = null; currentEpicId = null; currentSprintId = null; currentProfileId = null;
  }
  renderCurrentView();
}
function goBack() {
  if (prevPath) { const p = prevPath; prevPath = null; prevEpicId = null; navigateTo(p); }
  else { navigateTo('/'); }
}

function renderCurrentView() {
  // If the current view's service is disabled, bounce to an enabled one.
  if (currentView !== 'admin' && services.length && !ensureValidView()) return;
  const kanbanViews = KANBAN_VIEWS;
  document.body.classList.toggle('kanban-view', kanbanViews.includes(currentView));
  document.body.classList.toggle('view-admin', currentView === 'admin');
  document.body.classList.toggle('view-mail', currentView === 'mail');
  document.body.classList.toggle('view-wiki', currentView === 'wiki');
  document.body.classList.toggle('view-calendar', currentView === 'calendar');
  if (currentView === 'admin') { if (typeof renderAdminView === 'function') renderAdminView(); }
  else if (currentView === 'task' && currentTaskId) { renderTaskPage(currentTaskId).then(() => highlightCode()); }
  else if (currentView === 'epic' && currentEpicId) { renderEpicPage(currentEpicId).then(() => highlightCode()); }
  else if (currentView === 'sprint' && currentSprintId) { renderSprintPage(currentSprintId); }
  else if (currentView === 'backlog') { renderBacklogPage(); }
  else if (currentView === 'user' && currentProfileId) { renderUserPage(currentProfileId); }
  else if (currentView === 'wiki') { renderWikiView(); }
  else if (currentView === 'chat') { renderChatView(); }
  else if (currentView === 'calendar') { renderCalendarView(); }
  else if (currentView === 'mail') { renderMailView(); }
  else { renderBoard(); }
  renderAppRail();
  renderSidebar();
  if (typeof updateSearchScope === 'function') updateSearchScope();
}

// === Ecosystem services ===
const SERVICE_ICONS = { kanban: '&#x2B21;', wiki: '&#128214;', chat: '&#128172;', calendar: '&#128197;', mail: '&#9993;' };

const KANBAN_VIEWS = ['board', 'task', 'epic', 'sprint', 'backlog', 'user'];
function isServiceEnabled(name) { return services.some(s => s.name === name && s.enabled); }

// firstEnabledServicePath returns where to land when the current view's service is
// off: the kanban board if enabled, else the first enabled service, else settings.
function firstEnabledServicePath() {
  if (isServiceEnabled('kanban')) return '/';
  const s = services.find(x => x.enabled && x.name !== 'kanban');
  return s ? '/' + s.name : '/admin';
}
// ensureValidView redirects away from a view whose service has been disabled.
function ensureValidView() {
  const svc = KANBAN_VIEWS.includes(currentView) ? 'kanban' : currentView;
  if (['kanban', 'wiki', 'chat', 'calendar', 'mail'].includes(svc) && !isServiceEnabled(svc)) {
    navigateTo(firstEnabledServicePath());
    return false;
  }
  return true;
}

// an admin changes the application name, without a page reload.
function applyAppName(name) {

function renderAppRail() {
  const rail = document.getElementById('app-rail');

  if (typeof ensureAdminI18n === 'function') ensureAdminI18n();
  // Rail is always shown now: it carries the universal Settings button.
  document.body.classList.toggle('has-rail', true);

async function moveService(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= services.length) return;
  const order = services.map(s => s.name);
  [order[i], order[j]] = [order[j], order[i]];
  try {
    await api('/api/services/reorder', 'POST', { order });
    services = await api('/api/services');
  } catch (e) { alert(e.message); return; }
  renderAppRail();
  renderServicesSection();
}

async function toggleService(name, enabled) {
  try {
    await api('/api/services', 'POST', { name: name, enabled: enabled });
    services = await api('/api/services');
  } catch (e) { alert(e.message); return; }
  renderAppRail();
  renderServicesSection();

}

// === File attachment ===
function triggerFileAttach(textareaId) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.pdf,.txt,.csv,.json,.xml,.zip,.gz,.png,.jpg,.jpeg,.gif,.webp';
  inp.onchange = async () => {
    const file = inp.files[0];
    if (!file) return;
    _dbg('attach:', file.name, 'size:', file.size, 'type:', file.type, 'isImage:', _isImage(file));
    if (file.size > MAX_UPLOAD_SIZE && !_isImage(file)) { alert(t('fileTooLarge')); return; }
    const ta = document.getElementById(textareaId);
    const uploadFile = _isImage(file) ? await compressImage(file) : file;
    if (uploadFile.size > MAX_UPLOAD_SIZE) { alert(t('fileTooLarge')); return; }
    const mime = uploadFile.type || 'image/jpeg';
    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(',')[1];
      _dbg('attach: sending base64 length:', base64.length, 'mime:', mime);
      try {
        const res = await api('/api/files', 'POST', { data: base64, filename: file.name, mime: mime });
        const link = _isImage(file) ? `![${file.name}](${res.url})` : `[${file.name}](${res.url})`;
        if (ta) { const pos = ta.selectionStart; ta.value = ta.value.substring(0, pos) + link + ta.value.substring(ta.selectionEnd); ta.focus(); }
      } catch(e) { alert(t('uploadError') + ': ' + e.message); }
    };
    reader.readAsDataURL(uploadFile);
  };
  inp.click();
}

// === Init ===
async function init() {
  // Only a failed identity check means "not logged in" → go to login. Everything
  // else (a service init throwing, a stale cached script, etc.) must NOT bounce
  // the user, or first-run UI like the onboarding wizard would be lost.
  let me;
  try {
    me = await api('/api/auth/me');
  } catch(e) {
    window.location.href = '/login';
    return;
  }
  currentUser = me;
  updateUserUI();
  applyDirection();
  try {
    try { services = await api('/api/services'); } catch (e) { services = []; }
    await loadProjects();
    await loadBoard();
    // Default sprint filter to oldest active sprint
    const activeSprints = (state.sprints || []).filter(s => s.status === 'active').sort((a, b) => a.id - b.id);
    if (activeSprints.length > 0) {
      setSprintFilter(activeSprints[0].id);
    }
    route();
    applyI18n();
    initTimezoneSelect();
    pollNotifications();
    if (typeof chatInitGlobal === 'function') chatInitGlobal();
    if (typeof calInitGlobal === 'function') calInitGlobal();
    if (typeof mailInitGlobal === 'function') mailInitGlobal();
    // Search
    const searchEl = document.getElementById('search');
    if (searchEl) {
      searchEl.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => doSearch(this.value), SEARCH_DEBOUNCE_MS);
      });
      searchEl.addEventListener('keydown', function(e) { if (e.key === 'Escape') { this.value = ''; doSearch(''); } });
    }
  } catch(e) {
    console.error('init: non-fatal error', e);
  }
  // First-run UI runs independently so an error above can't suppress it.
  try { await maybeShowOnboarding(); } catch(e) { console.error('onboarding', e); }
  try { maybeStartTour(); } catch(e) { console.error('tour', e); }
}

// === Per-user onboarding tour (skippable coachmarks) ===
const TOUR_STEPS = [
  { sel: '#project-hdr', key: 'tourProject' },
  { sel: '#app-rail', key: 'tourRail' },
  { sel: '#search', key: 'tourSearch' },
  { sel: '.rail-admin', key: 'tourSettings' },
];
let _tour = null;
function tourFlagKey() { return 'kanban-tour-done-' + (currentUser ? currentUser.id : 0); }
function maybeStartTour() {
  if (!currentUser) return;
  if (localStorage.getItem(tourFlagKey())) return;
  // Don't compete with the admin instance wizard; if it's open, skip for now.
  if (document.querySelector('.onboarding-overlay')) return;
  setTimeout(startTour, 400);
}
function startTour() {
  const steps = TOUR_STEPS.filter(s => { const el = document.querySelector(s.sel); return el && el.offsetParent !== null; });
  if (!steps.length) return;
  let ov = document.getElementById('tour-overlay');
  if (ov) ov.remove();
  ov = document.createElement('div');
  ov.id = 'tour-overlay';
  ov.innerHTML = `<div class="tour-ring" id="tour-ring"></div><div class="tour-pop" id="tour-pop"></div>`;
  document.body.appendChild(ov);
  _tour = { steps, i: 0 };
  tourShow();
  window.addEventListener('resize', tourShow);
}
function tourShow() {
  if (!_tour) return;
  const step = _tour.steps[_tour.i];
  const el = document.querySelector(step.sel);
  if (!el) { tourEnd(); return; }
  const r = el.getBoundingClientRect();
  const pad = 6;
  const ring = document.getElementById('tour-ring');
  ring.style.left = (r.left - pad) + 'px';
  ring.style.top = (r.top - pad) + 'px';
  ring.style.width = (r.width + pad * 2) + 'px';
  ring.style.height = (r.height + pad * 2) + 'px';
  const pop = document.getElementById('tour-pop');
  const last = _tour.i === _tour.steps.length - 1;
  pop.innerHTML = `<div class="tour-text">${esc(t(step.key))}</div>
    <div class="tour-actions">
      <span class="tour-count">${_tour.i + 1}/${_tour.steps.length}</span>
      <button class="btn btn-ghost btn-sm" onclick="tourEnd()">${esc(t('tourSkip'))}</button>
      <button class="btn btn-primary btn-sm" onclick="tourNext()">${esc(last ? t('tourDone') : t('tourNext'))}</button>
    </div>`;
  // Position the popover: prefer below the target, then above; for tall edge
  // elements (e.g. the full-height services rail) put it to the side so it never
  // covers the highlighted element.
  pop.style.visibility = 'hidden';
  pop.style.left = '0px'; pop.style.top = '0px';
  const vw = window.innerWidth, vh = window.innerHeight;
  const pw = Math.min(320, vw - 20);
  pop.style.width = pw + 'px';
  const ph = pop.offsetHeight;
  const clampX = x => Math.min(Math.max(8, x), vw - pw - 8);
  const clampY = y => Math.min(Math.max(8, y), vh - ph - 8);
  let top, left;
  if (r.bottom + 12 + ph <= vh - 8) {            // below
    top = r.bottom + 12; left = clampX(r.left);
  } else if (r.top - 12 - ph >= 8) {             // above
    top = r.top - 12 - ph; left = clampX(r.left);
  } else if (r.right + 12 + pw <= vw - 8) {      // to the right
    left = r.right + 12; top = clampY(r.top);
  } else {                                        // to the left
    left = Math.max(8, r.left - 12 - pw); top = clampY(r.top);
  }
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.visibility = 'visible';
}
function tourNext() {
  if (!_tour) return;
  if (_tour.i >= _tour.steps.length - 1) { tourEnd(); return; }
  _tour.i++;
  tourShow();
}
function tourEnd() {
  const ov = document.getElementById('tour-overlay');
  if (ov) ov.remove();
  window.removeEventListener('resize', tourShow);
  _tour = null;
  if (currentUser) localStorage.setItem(tourFlagKey(), '1');
}
function restartTour() {
  if (currentUser) localStorage.removeItem(tourFlagKey());
  startTour();
}

function renderTelegramSection() {

  if (!el) return;

    html += `<div id="tg-admin-section"></div>`;
    api('/api/settings/telegram').then(r => {
      const section = document.getElementById('tg-admin-section');
      if (!section) return;
      if (r.token) {
        // Already configured — show summary with "Change" button
        const maskedToken = r.token.slice(0, 6) + '••••••';
        const botName = r.bot_username || '';
        section.innerHTML = `<div style="margin-bottom:8px">
          <div style="font-size:.82rem;color:var(--fg2);margin-bottom:4px">${t('telegramBotToken')}: <code style="color:var(--fg3)">${esc(maskedToken)}</code></div>

      } else {
        showTelegramEditForm('', '');
      }

  if (botUsername && !isAdmin()) {
    html += `<div style="font-size:.82rem;color:var(--fg2);margin-bottom:6px">Bot: <a href="https://t.me/${botUsername.replace(/^@/,'')}" target="_blank" rel="noopener" style="color:var(--accent2)">@${esc(botUsername.replace(/^@/,''))}</a></div>`;
  }

    html += `<div style="font-size:.82rem;color:var(--green);margin-bottom:4px">&#10004; ${t('telegramLinked')}</div>
      <button class="btn btn-ghost btn-sm" onclick="unlinkTelegram()">${t('unlinkTelegram')}</button>`;

    html += `<div style="font-size:.82rem;color:var(--fg3);margin-bottom:4px">${t('telegramNotLinked')}</div>

// === Board rendering ===
function renderBoard() {
  const app = document.getElementById('app');
  // Save scroll positions before re-render
  const oldBoard = app.querySelector('.board');
  const savedScrollLeft = oldBoard ? oldBoard.scrollLeft : 0;
  const colScrolls = {};
  if (oldBoard) {
    oldBoard.querySelectorAll('.column').forEach(col => {
      const cid = col.dataset.col;
      const body = col.querySelector('.col-body');
      if (cid && body) colScrolls[cid] = body.scrollTop;
    });
  }
  let html = '<div class="board">';
  for (const col of state.columns) {
    const colTasks = state.tasks.filter(t => t.column_id === col.id).sort((a,b) => a.position - b.position || a.id - b.id);
    const filtered = filterTasks(colTasks);
    html += `<div class="column" data-col="${col.id}" ondragover="onDragOver(event)" ondrop="onDrop(event, ${col.id})">
      <div class="col-header"><span class="col-title">${esc(col.name)} <span class="col-count">${filtered.length}</span></span>${!isReadonly() ? `<button class="col-add-btn" onclick="showCreateTask(${col.id})" title="${t('addTask')}">+</button>` : ''}</div>
      <div class="col-body">`;
    for (const task of filtered) {
      html += renderCard(task);
    }
    html += '</div></div>';
  }
  html += '</div>';
  app.innerHTML = html;
  // Restore scroll positions after re-render
  const newBoard = app.querySelector('.board');
  if (newBoard) {
    newBoard.scrollLeft = savedScrollLeft;
    newBoard.querySelectorAll('.column').forEach(col => {
      const cid = col.dataset.col;
      const body = col.querySelector('.col-body');
      if (cid && body && colScrolls[cid]) body.scrollTop = colScrolls[cid];
    });
  }
}

function filterTasks(tasks) {
  let result = tasks;
  if (boardSprintFilter !== null) {
    result = result.filter(t => t.sprint_id === boardSprintFilter);
  }
  if (boardEpicFilter !== null) {
    result = result.filter(t => t.epic_id === boardEpicFilter);
  }
  if (showPersonalOnly && currentUser) {
    result = result.filter(t => t.assignee_id === currentUser.id || (t.assignee && t.assignee.id === currentUser.id));
  }
  if (searchMatchIds !== null) {
    result = result.filter(t => searchMatchIds.includes(t.id));
  }
  return result;
}

function toggleHdrFilter(e, ddId, items, currentVal, setFn) {
  e.stopPropagation();
  // close any other open dropdown
  document.querySelectorAll('.hdr-filter-dropdown').forEach(d => { if (d.id !== ddId) d.classList.add('hidden'); });
  const dd = document.getElementById(ddId);
  if (!dd) return;
  if (dd.classList.contains('hidden')) {
    let html = `<div class="sfd-item${currentVal===null?' active':''}" onclick="${setFn}(null)">ALL</div>`;
    for (const it of items) {
      html += `<div class="sfd-item${currentVal===it.id?' active':''}" onclick="${setFn}(${it.id})">${esc(it.name)}</div>`;
    }
    dd.innerHTML = html;
    dd.classList.remove('hidden');
    setTimeout(() => document.addEventListener('click', closeHdrFilters, {once:true}), 0);
  } else {
    dd.classList.add('hidden');
  }
}
function closeHdrFilters() {
  document.querySelectorAll('.hdr-filter-dropdown').forEach(d => d.classList.add('hidden'));
}
// Generic header dropdown toggle for service filters (mail/wiki/calendar). The
// service pre-renders the dropdown's inner items; this just shows/hides it and
// closes other open dropdowns. Uses the same .hdr-filter visual style as kanban.
function hdrDropToggle(e, ddId) {
  if (e) e.stopPropagation();
  const dd = document.getElementById(ddId);
  if (!dd) return;
  const show = dd.classList.contains('hidden');
  closeHdrFilters();
  if (show) {
    dd.classList.remove('hidden');
    setTimeout(() => document.addEventListener('click', closeHdrFilters, { once: true }), 0);
  }
}
function toggleSprintFilter(e) {
  const sprints = [...state.sprints].sort((a,b) => b.id - a.id);
  toggleHdrFilter(e, 'sprint-filter-dropdown', sprints, boardSprintFilter, 'setSprintFilter');
}
function toggleEpicFilter(e) {
  const epics = [...state.epics].sort((a,b) => b.id - a.id);
  toggleHdrFilter(e, 'epic-filter-dropdown', epics, boardEpicFilter, 'setEpicFilter');
}
function setSprintFilter(sprintId) {
  boardSprintFilter = sprintId;
  const label = document.getElementById('sprint-filter-label');
  if (label) {
    if (sprintId === null) { label.textContent = 'ALL'; }
    else { const sp = state.sprints.find(s => s.id === sprintId); label.textContent = sp ? sp.name : 'ALL'; }
  }
  closeHdrFilters();
  if (currentView === 'board') renderBoard();
}
function setEpicFilter(epicId) {
  boardEpicFilter = epicId;
  const label = document.getElementById('epic-filter-label');
  if (label) {
    if (epicId === null) { label.textContent = 'ALL'; }
    else { const ep = state.epics.find(e => e.id === epicId); label.textContent = ep ? ep.name : 'ALL'; }
  }
  closeHdrFilters();
  if (currentView === 'board') renderBoard();
}
function resetBoardFilters() {
  boardSprintFilter = null;
  boardEpicFilter = null;
  const sl = document.getElementById('sprint-filter-label');
  const el = document.getElementById('epic-filter-label');
  if (sl) sl.textContent = 'ALL';
  if (el) el.textContent = 'ALL';
}

function renderCard(task) {
  const pClass = task.priority > 0 ? `<div class="card-priority priority-${task.priority}"></div>` : '';
  const epicHtml = task.epic ? `<span class="card-epic" style="background:${task.epic.color};color:${contrastColor(task.epic.color)}" onclick="event.stopPropagation();navigateTo('/epic/${task.epic.id}')">${esc(task.epic.name)}</span>` : '';
  const sprintHtml = task.sprint ? `<span class="card-epic" style="background:var(--accent);color:#fff;font-size:.7rem" onclick="event.stopPropagation();navigateTo('/sprint/${task.sprint.id}')">${esc(task.sprint.name)}</span>` : '';
  const tagsHtml = (task.tags || []).map(tg => `<span class="card-tag" style="background:${tg.color};color:${contrastColor(tg.color)}">${esc(tg.name)}</span>`).join('');
  const assigneeHtml = task.assignee ? `<span class="card-assignee">&#128100; ${esc(task.assignee.username)}</span>` : '';
  const todoInfo = countTodos(task.todo);
  const todoHtml = todoInfo ? `<span class="card-todo">&#9745; ${todoInfo.done}/${todoInfo.total}</span>` : '';
  const linkHtml = task.project_url ? `<span class="card-link">&#128279;</span>` : '';
  const commentsCount = (task.comments || []).length;
  const commentsHtml = commentsCount > 0 ? `<span class="card-comments">&#128172; ${commentsCount}</span>` : '';
  const isInDoneCol = state.columns.length > 0 && task.column_id === state.columns[state.columns.length - 1].id;
  const deadlineHtml = task.deadline ? renderDeadlineDot(task.deadline, isInDoneCol) : '';

  return `<div class="card" draggable="${isReadonly()?'false':'true'}" data-task="${task.id}"
    onclick="navigateTo('/task/${task.id}')"
    ondragstart="onDragStart(event, ${task.id})" ondragend="onDragEnd(event)">
    ${pClass}
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="card-title" style="margin-bottom:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(task.title)}</div>
      <span class="card-id" style="margin-left:8px;flex-shrink:0">${taskRef(task)}</span>
    </div>
    <div class="card-meta">${sprintHtml}${deadlineHtml}${epicHtml}${tagsHtml}${assigneeHtml}${todoHtml}${linkHtml}${commentsHtml}</div>
  </div>`;
}

function renderDeadlineDot(deadline, isDone) {
  if (!deadline) return '';
  const dl = new Date(deadline);
  const now = new Date();
  const diff = dl - now;
  const hours = diff / (1000*60*60);
  let cls = 'card-deadline';
  if (!isDone) {
    if (diff < 0) cls += ' overdue';
    else if (hours < 48) cls += ' soon';
  }
  const remaining = isDone ? '' : '<br>' + formatTimeRemaining(diff);
  return `<span class="${cls}"><span class="deadline-popup">${t('deadline')}: ${fmtDate(deadline)}${remaining}</span></span>`;
}

function formatTimeRemaining(diff) {
  if (diff < 0) return t('deadlinePassed') + ' ' + formatDuration(-diff);
  return t('deadlineLeft') + ' ' + formatDuration(diff);
}

function formatDuration(ms) {
  const d = Math.floor(ms / (1000*60*60*24));
  const h = Math.floor((ms % (1000*60*60*24)) / (1000*60*60));
  if (d > 0) return d + 'd ' + h + 'h';
  const m = Math.floor((ms % (1000*60*60)) / (1000*60));
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

// === Drag & Drop ===
let _dragListenerActive = false;
function dragAutoScroll(e) {
  const edge = 60, speed = 18;
  const y = e.clientY;
  const h = window.innerHeight;
  if (y < edge) { window.scrollBy(0, -speed); }
  else if (y > h - edge) { window.scrollBy(0, speed); }
}
function onDragStart(e, taskId) {
  draggedTaskId = taskId; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
  if (!_dragListenerActive) { document.addEventListener('dragover', dragAutoScroll); _dragListenerActive = true; }
}
function onDragEnd(e) {
  e.target.classList.remove('dragging'); draggedTaskId = null;
  if (_dragListenerActive) { document.removeEventListener('dragover', dragAutoScroll); _dragListenerActive = false; }
}
function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
async function onDrop(e, colId) {
  e.preventDefault();
  if (!draggedTaskId) return;
  const taskId = draggedTaskId;
  draggedTaskId = null;
  const colBody = e.target.closest('.col-body');
  const cards = colBody ? Array.from(colBody.querySelectorAll('.card')) : [];
  let pos = cards.length;
  const dropTarget = e.target.closest('.card');
  if (dropTarget) {
    const idx = cards.indexOf(dropTarget);
    if (idx >= 0) pos = idx;
  }
  try {
    await api('/api/tasks/move', 'POST', { task_id: taskId, column_id: colId, position: pos });
    // Surgical DOM update for immediate feedback
    const draggedCard = document.querySelector(`.card[data-task="${taskId}"]`);
    const oldColEl = draggedCard ? draggedCard.closest('.column') : null;
    const oldColId = oldColEl ? oldColEl.dataset.col : null;
    if (draggedCard && colBody) {
      const targetCards = Array.from(colBody.querySelectorAll('.card'));
      if (pos < targetCards.length) {
        colBody.insertBefore(draggedCard, targetCards[pos]);
      } else {
        colBody.appendChild(draggedCard);
      }
      updateColCount(oldColId);
      updateColCount(colId);
    }
    // Refetch full state to stay in sync
    await loadBoard();
  } catch(e) { console.error(e); }
}
function updateColCount(colId) {
  if (!colId) return;
  const colEl = document.querySelector(`.column[data-col="${colId}"]`);
  if (!colEl) return;
  const cnt = colEl.querySelectorAll('.card').length;
  const badge = colEl.querySelector('.col-count');
  if (badge) badge.textContent = cnt;
}

      </div>

    <div class="task-page-body">

  if (task.sprint) html += `<div class="task-info-item"><label>${t('sprint')}</label><span class="value"><a href="/sprint/${task.sprint.id}" onclick="navigateTo('/sprint/${task.sprint.id}');return false;" style="color:var(--accent2)">${esc(task.sprint.name)}</a></span></div>`;
  if (task.assignee) html += `<div class="task-info-item"><label>${t('assignee')}</label><span class="value"><a href="/user/${task.assignee.id}" onclick="navigateTo('/user/${task.assignee.id}');return false;">&#128100; ${esc(task.assignee.username)}</a></span></div>`;
  if (task.deadline) {
    const dl = new Date(task.deadline);
    const diff = dl - new Date();
    const taskInDone = state.columns.length > 0 && task.column_id === state.columns[state.columns.length - 1].id;
    const remaining = taskInDone ? '' : ' (' + formatTimeRemaining(diff) + ')';
    const color = taskInDone ? 'var(--fg2)' : diff < 0 ? 'var(--red)' : diff < 48*3600*1000 ? 'var(--orange)' : 'var(--fg2)';
    html += `<div class="task-info-item"><label>${t('deadline')}</label><span class="value" style="color:${color}">${fmtDate(task.deadline)}${remaining}</span></div>`;
  }
  if (subscribed) html += `<div class="task-info-item"><label>${t('notifications')}</label><span class="value" style="color:var(--green)">&#10004; ${t('subscribed')}</span></div>`;
  html += `</div>

    task.dependents.forEach(d => { html += `<a href="/task/${d.id}" onclick="navigateTo('/task/${d.id}');return false;" style="margin-right:8px">#${d.id} ${esc(d.title)}</a>`; });
    html += '</div></div>';
  }

  // Comments
  html += `<div class="task-page-section"><h3>${t('comments')} (${(task.comments||[]).length})
    <button class="btn btn-ghost btn-sm comment-sort-toggle" onclick="toggleCommentSort()" title="${escAttr(t('commentSortToggle'))}">${commentSortPref()==='newest'?'&#8593;':'&#8595;'} ${commentSortPref()==='newest'?t('commentNewest'):t('commentOldest')}</button>

    html += `<div class="comment-form">

      </div>

  } else {
    html += renderComments(task.comments, task.id);

  html += '</div></div></div></div>';

  // Setup paste for comment textarea

    setupPaste(ta);
    ta.addEventListener('input', () => saveCommentDraft(task.id, ta.value));
  }

// === Comment draft preservation ===
const commentDrafts = {};
function getCommentDraft(taskId) { return commentDrafts[taskId] || ''; }
function saveCommentDraft(taskId, text) { commentDrafts[taskId] = text; }
function clearCommentDraft(taskId) { delete commentDrafts[taskId]; }

// === Comment rendering with deep nesting ===
// commentSortPref / toggleCommentSort: per-user ordering of the top-level
// comment list (oldest-first default), shared by task and wiki comments.
function commentSortPref() { return localStorage.getItem('kanban-comment-sort') === 'newest' ? 'newest' : 'oldest'; }
function toggleCommentSort() {
  localStorage.setItem('kanban-comment-sort', commentSortPref() === 'newest' ? 'oldest' : 'newest');
  if (typeof currentTaskId !== 'undefined' && currentTaskId) renderTaskPage(currentTaskId);
  else if (typeof wikiRenderCommentList === 'function') wikiRenderCommentList();
}

function renderComments(comments, taskId, depth) {
  if (!depth) depth = 0;
  // Top-level comments follow the user's sort preference; replies stay oldest-first.
  if (depth === 0 && commentSortPref() === 'newest') comments = comments.slice().reverse();
  let html = '';
  for (const c of comments) {
    const authorName = c.author ? c.author.username : '?';
    const isEdited = c.updated_at && new Date(c.updated_at).getFullYear() > 1 && c.created_at && (new Date(c.updated_at).getTime() - new Date(c.created_at).getTime() > 2000);
    const editedHtml = isEdited ? ` <span class="comment-edited" title="${t('created')}: ${fmtDate(c.created_at)}&#10;${t('updated')}: ${fmtDate(c.updated_at)}">(${t('edited')})</span>` : '';
    const canEdit = currentUser && c.author && c.author.id === currentUser.id;

    html += `<div class="comment" id="comment-${c.id}" ${!isReadonly() ? `ondblclick="event.stopPropagation();showReplyForm(${c.id},${taskId})"` : ''}>
      <div class="comment-author"><a href="/user/${c.author?c.author.id:0}" onclick="navigateTo('/user/${c.author?c.author.id:0}');return false;">@${esc(authorName)}</a></div>
      <div class="comment-text" id="comment-text-${c.id}"><div class="md-content">${renderMd(c.text)}</div></div>
      <div class="comment-time">
        <span>${fmtDate(c.created_at)}${editedHtml}</span>
        <div class="comment-actions">
          ${!isReadonly() ? `<button onclick="showReplyForm(${c.id},${taskId})">${t('reply')}</button>` : ''}
          ${canEdit ? `<button onclick="showEditComment(${c.id},${taskId})">${t('edit')}</button>` : ''}
          ${canEdit || isAdmin() ? `<button onclick="deleteComment(${c.id},${taskId})" style="color:var(--red)">${t('delete')}</button>` : ''}
        </div>
      </div>
      <div id="reply-form-${c.id}"></div>`;
    if (c.replies && c.replies.length > 0) {
      html += `<div class="comment-replies">${renderComments(c.replies, taskId, depth+1)}</div>`;
    }
    html += '</div>';
  }
  return html;
}

function showReplyForm(commentId, taskId) {
  const el = document.getElementById('reply-form-' + commentId);
  if (!el) return;
  if (el.innerHTML) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="reply-form">
    ${insertMdToolbar('reply-text-'+commentId)}
    <textarea id="reply-text-${commentId}" placeholder="${t('writeComment')}"></textarea>
    <div style="display:flex;gap:4px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('reply-form-${commentId}').innerHTML=''">${t('cancel')}</button>
      <button class="btn btn-primary btn-sm" onclick="submitReply(${taskId},${commentId})">${t('send')}</button>
    </div>
  </div>`;
  const ta = document.getElementById('reply-text-' + commentId);
  if (ta) { setupPaste(ta); ta.focus(); }
}

function showEditComment(commentId, taskId) {
  const el = document.getElementById('comment-text-' + commentId);
  if (!el || el.dataset.loading) return;
  const mdEl = el.querySelector('.md-content');
  // Get original text from rendered markdown - we need the raw text
  // Store original in data attr on first edit
  if (!el.dataset.rawText) {
    el.dataset.loading = '1';
    // Fetch the task again to get raw text
    api('/api/tasks/' + taskId).then(task => {
      delete el.dataset.loading;
      const comment = findCommentById(task.comments, commentId);
      if (!comment) return;
      el.dataset.rawText = comment.text;
      replaceWithEditForm(el, commentId, taskId, comment.text);
    }).catch(() => { delete el.dataset.loading; });
    return;
  }
  replaceWithEditForm(el, commentId, taskId, el.dataset.rawText);
}

function findCommentById(comments, id) {
  for (const c of comments) {
    if (c.id === id) return c;
    if (c.replies) {
      const found = findCommentById(c.replies, id);
      if (found) return found;
    }
  }
  return null;
}

function replaceWithEditForm(el, commentId, taskId, rawText) {
  el.innerHTML = `<div class="reply-form">
    ${insertMdToolbar('edit-comment-'+commentId)}
    <textarea id="edit-comment-${commentId}" style="min-height:80px">${esc(rawText)}</textarea>
    <div style="display:flex;gap:4px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="cancelEditComment(${commentId})">${t('cancel')}</button>
      <button class="btn btn-primary btn-sm" onclick="saveEditComment(${commentId},${taskId})">${t('save')}</button>
    </div>
  </div>`;
  const ta = document.getElementById('edit-comment-' + commentId);
  if (ta) { setupPaste(ta); ta.focus(); }
}

function cancelEditComment(commentId) {
  const el = document.getElementById('comment-text-' + commentId);
  if (!el || !el.dataset.rawText) return;
  el.innerHTML = `<div class="md-content">${renderMd(el.dataset.rawText)}</div>`;
  highlightCode();
}

async function submitComment(taskId) {
  const ta = document.getElementById('comment-text');
  if (!ta || !ta.value.trim()) return;
  try {
    await api('/api/comments', 'POST', { task_id: taskId, text: ta.value.trim() });
    clearCommentDraft(taskId);
    ta.value = '';
    // Reload comments only
    const task = await api('/api/tasks/' + taskId);
    const cl = document.getElementById('comments-list');
    if (cl) {
      cl.innerHTML = (task.comments && task.comments.length > 0)
        ? renderComments(task.comments, taskId)
        : `<p style="color:var(--fg3);font-size:.85rem">${t('noComments')}</p>`;
      highlightCode();
    }
  } catch(e) { alert(t('error') + ': ' + e.message); }
}

async function submitReply(taskId, parentId) {
  const ta = document.getElementById('reply-text-' + parentId);
  if (!ta || !ta.value.trim()) return;
  try {
    await api('/api/comments', 'POST', { task_id: taskId, text: ta.value.trim(), parent_id: parentId });
    await refreshComments(taskId);
  } catch(e) { alert(t('error') + ': ' + e.message); }
}

async function saveEditComment(commentId, taskId) {
  const ta = document.getElementById('edit-comment-' + commentId);
  if (!ta || !ta.value.trim()) return;
  try {
    await api('/api/comments/' + commentId, 'PUT', { text: ta.value.trim() });
    await refreshComments(taskId);
  } catch(e) { alert(t('error') + ': ' + e.message); }
}

async function deleteComment(commentId, taskId) {
  // Check if comment has replies by looking at the DOM
  const commentEl = document.getElementById('comment-' + commentId);
  const hasReplies = commentEl && commentEl.querySelector('.comment-replies .comment');
  let msg = t('deleteCommentConfirm');
  if (hasReplies) msg = t('deleteCommentTreeConfirm');
  if (!await uiConfirm(msg)) return;
  try { await api('/api/comments/' + commentId, 'DELETE'); await refreshComments(taskId); } catch(e) { alert(t('error')); }
}

async function refreshComments(taskId) {
  const task = await api('/api/tasks/' + taskId);
  const cl = document.getElementById('comments-list');
  if (cl) {
    cl.innerHTML = (task.comments && task.comments.length > 0)
      ? renderComments(task.comments, taskId)
      : `<p style="color:var(--fg3);font-size:.85rem">${t('noComments')}</p>`;
    highlightCode();
  }
  // Restore comment draft if present
  const draft = getCommentDraft(taskId);
  const ta = document.getElementById('comment-text');
  if (ta && draft) {
    ta.value = draft;
  }
}

// === TODO items ===
let _todoLock = false;
function renderTodoList(taskId, items) {
  const list = document.querySelector('.todo-list');
  if (list) {
    list.innerHTML = items.map((item, i) => `<div class="todo-item ${item.done?'done':''}">
      <input type="checkbox" ${item.done?'checked':''} onchange="toggleTodo(${taskId},${i},this.checked)" ${isReadonly()?'disabled':''}>
      <span class="todo-text">${esc(item.label)}</span>
      ${!isReadonly() ? `<button class="btn-icon" onclick="deleteTodoItem(${taskId},${i})">&#10005;</button>` : ''}
    </div>`).join('');
  }
}
async function toggleTodo(taskId, index, checked) {
  if (_todoLock) return;
  _todoLock = true;
  try {
    const task = await api('/api/tasks/' + taskId);
    let items = parseTodoItems(task.todo);
    if (items[index]) items[index].done = checked;
    items = sortTodos(items); // move done to the end automatically
    await api('/api/tasks/' + taskId, 'PUT', { ...taskToReq(task), todo: todoItemsToText(items) });
    renderTodoList(taskId, items);
  } finally { _todoLock = false; }
}
async function addTodoItem(taskId) {
  if (_todoLock) return;
  const inp = document.getElementById('todo-new');
  if (!inp || !inp.value.trim()) return;
  _todoLock = true;
  try {
    const label = inp.value.trim();
    const task = await api('/api/tasks/' + taskId);
    let items = parseTodoItems(task.todo);
    items.push({ done: false, label });
    items = sortTodos(items); // new pending item sits above completed ones
    await api('/api/tasks/' + taskId, 'PUT', { ...taskToReq(task), todo: todoItemsToText(items) });
    inp.value = '';
    renderTodoList(taskId, items);
  } finally { _todoLock = false; }
}
async function deleteTodoItem(taskId, index) {
  if (_todoLock) return;
  _todoLock = true;
  try {
    const task = await api('/api/tasks/' + taskId);
    const items = parseTodoItems(task.todo);
    items.splice(index, 1);
    await api('/api/tasks/' + taskId, 'PUT', { ...taskToReq(task), todo: todoItemsToText(items) });
    renderTodoList(taskId, items);
  } finally { _todoLock = false; }
}

function taskToReq(task) {
  return {
    title: task.title, description: task.description, todo: task.todo, project_url: task.project_url,
    column_id: task.column_id, epic_id: task.epic_id, sprint_id: task.sprint_id, assignee_id: task.assignee_id,
    priority: task.priority, tag_ids: (task.tags||[]).map(t=>t.id),
    depends_on_ids: (task.depends_on||[]).map(d=>d.id),
    deadline: task.deadline || ''
  };
}

async function toggleSubscription(taskId, isSubscribed) {
  try {
    if (isSubscribed) { await api('/api/unsubscribe', 'POST', { task_id: taskId }); }
    else { await api('/api/subscribe', 'POST', { task_id: taskId }); }
    // Update button text without full re-render
    const btn = document.getElementById('sub-btn-' + taskId);
    if (btn) {
      const newState = !isSubscribed;
      btn.textContent = newState ? t('unsubscribe') : t('subscribe');
      btn.setAttribute('onclick', `toggleSubscription(${taskId}, ${newState})`);
    }
  } catch(e) { alert(t('error')); }
}

function sortEpicTasks(tasks, mode) {
  const sorted = [...tasks];
  switch (mode) {
    case 'priority': sorted.sort((a,b) => (b.priority||0) - (a.priority||0) || a.position - b.position); break;
    case 'date': sorted.sort((a,b) => new Date(b.created_at) - new Date(a.created_at)); break;
    case 'title': sorted.sort((a,b) => (a.title||'').localeCompare(b.title||'')); break;
    default: sorted.sort((a,b) => a.position - b.position || a.id - b.id); break;
  }
  return sorted;
}

async function moveEpicTask(taskId, colId, epicId) {
  try {
    await api('/api/tasks/move', 'POST', { task_id: taskId, column_id: colId, position: 9999 });
    renderEpicPage(epicId);
  } catch(e) { alert(t('error')); }
}

// === Epic Page ===
async function renderEpicPage(epicId) {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="epic-page"><p>Loading...</p></div>';
  let data;
  try { data = await api('/api/epics/' + epicId); } catch { app.innerHTML = `<div class="epic-page"><p>${t('notFound')}</p><a href="/" onclick="navigateTo('/');return false;">${t('backToBoard')}</a></div>`; return; }
  const epic = data.epic;
  const tasks = data.tasks || [];
  const firstCol = state.columns.length ? state.columns[0] : null;
  const lastCol = state.columns.length ? state.columns[state.columns.length-1] : null;
  const doneCount = lastCol ? tasks.filter(t => t.column_id === lastCol.id).length : 0;
  const pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;

  // Split tasks into 3 groups: backlog, active, done
  const backlogTasks = firstCol ? tasks.filter(t => t.column_id === firstCol.id) : [];
  const doneTasks = lastCol ? tasks.filter(t => t.column_id === lastCol.id) : [];
  const activeTasks = tasks.filter(t => {
    if (firstCol && t.column_id === firstCol.id) return false;
    if (lastCol && t.column_id === lastCol.id) return false;
    return true;
  });

  let epicSortMode = localStorage.getItem('kanban-epic-sort') || 'position';
  let epicBacklogSort = localStorage.getItem('kanban-epic-backlog-sort') || 'position';
  let epicDoneSort = localStorage.getItem('kanban-epic-done-sort') || 'position';

  const prioColors = ['','var(--blue)','var(--green)','var(--orange)','var(--red)'];

  function renderEpicTaskRow(task) {
    const colName = state.columns.find(c => c.id === task.column_id);
    let colSelect = '';
    if (!isReadonly() && state.columns.length > 1) {
      const opts = state.columns.map(c => `<option value="${c.id}" ${c.id === task.column_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
      colSelect = `<select class="epic-task-col-select" onclick="event.stopPropagation()" onchange="event.stopPropagation();moveEpicTask(${task.id},+this.value,${epicId})" style="background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:2px 6px;color:var(--fg);font-size:.78rem;cursor:pointer">${opts}</select>`;
    }
    return `<div class="epic-task-row" onclick="navigateTo('/task/${task.id}')">
      <span class="card-id">${taskRef(task)}</span>
      <span class="epic-task-title">${esc(task.title)}</span>
      ${task.priority > 0 ? `<span class="epic-task-prio" style="color:${prioColors[task.priority]}">P${task.priority}</span>` : ''}
      ${colSelect || `<span class="epic-task-status">${colName ? esc(colName.name) : ''}</span>`}
    </div>`;
  }

  function renderSortSelect(storageKey, currentMode) {
    return `<select onchange="localStorage.setItem('${storageKey}',this.value);renderEpicPage(${epicId})" style="background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:4px 8px;color:var(--fg);font-size:.82rem">
      <option value="position" ${currentMode==='position'?'selected':''}>${t('sortPosition')}</option>
      <option value="priority" ${currentMode==='priority'?'selected':''}>${t('sortPriority')}</option>
      <option value="date" ${currentMode==='date'?'selected':''}>${t('sortDate')}</option>
      <option value="title" ${currentMode==='title'?'selected':''}>${t('sortTitle')}</option>
    </select>`;
  }

  let html = `<div class="epic-page">
    <div class="epic-page-header">
      <h2><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${epic.color};margin-right:6px;vertical-align:middle"></span>${esc(epic.name)}</h2>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="navigateTo('/')">${t('back')}</button>
        ${!isReadonly() ? `<button class="btn btn-ghost btn-sm" onclick="showCreateTask(null, ${epic.id})">${t('addTask')}</button>
        <button class="btn btn-ghost btn-sm" onclick="showEditEpic(${epic.id})">${t('editEpic')}</button>` : ''}
      </div>
    </div>`;
  if (epic.description) {
    html += `<div class="task-page-section" style="margin-bottom:16px"><div class="md-content">${renderMd(epic.description)}</div></div>`;
  }
  html += `<div class="epic-progress" style="margin-bottom:16px">
      <span class="epic-progress-text">${doneCount}/${tasks.length} ${t('tasksCompleted')} (${pct}%)</span>
      <div class="epic-progress-bar"><div class="epic-progress-fill" style="width:${pct}%;background:${epic.color}"></div></div>
    </div>`;

  // Active tasks section
  html += `<div style="margin-bottom:8px;display:flex;gap:6px;align-items:center;justify-content:space-between">
      <h3 style="margin:0">${t('active')} (${activeTasks.length})</h3>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:.78rem;color:var(--fg3)">${t('sortBy')}:</span>
        ${renderSortSelect('kanban-epic-sort', epicSortMode)}
      </div>
    </div>
    <div class="epic-task-list">`;
  const sortedActive = sortEpicTasks(activeTasks, epicSortMode);
  for (const task of sortedActive) {
    html += renderEpicTaskRow(task);
  }
  if (activeTasks.length === 0) html += `<p style="color:var(--fg3)">${t('noActiveTasks')}</p>`;
  html += '</div>';

  // Backlog section (after active)
  if (backlogTasks.length > 0) {
    const sortedBacklog = sortEpicTasks(backlogTasks, epicBacklogSort);
    html += `<div class="task-page-section" style="margin-top:16px;opacity:.7">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0">${t('backlog')} (${backlogTasks.length})</h3>
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-size:.78rem;color:var(--fg3)">${t('sortBy')}:</span>
          ${renderSortSelect('kanban-epic-backlog-sort', epicBacklogSort)}
        </div>
      </div>
      <div class="epic-task-list">${sortedBacklog.map(renderEpicTaskRow).join('')}</div>
    </div>`;
  }

  // Done section (at the bottom)
  if (doneTasks.length > 0) {
    const sortedDone = sortEpicTasks(doneTasks, epicDoneSort);
    html += `<div class="task-page-section" style="margin-top:16px;opacity:.6">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0">${t('done')} (${doneTasks.length})</h3>
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-size:.78rem;color:var(--fg3)">${t('sortBy')}:</span>
          ${renderSortSelect('kanban-epic-done-sort', epicDoneSort)}
        </div>
      </div>
      <div class="epic-task-list">${sortedDone.map(renderEpicTaskRow).join('')}</div>
    </div>`;
  }

  html += '</div>';
  app.innerHTML = html;
}

// === Notifications ===
let notifOpen = false;
function toggleNotifications() {
  notifOpen = !notifOpen;
  const dd = document.getElementById('notif-dropdown');
  if (!dd) return;
  if (notifOpen) { loadNotifications(); dd.classList.remove('hidden'); }
  else { dd.classList.add('hidden'); }
}

async function loadNotifications() {
  const dd = document.getElementById('notif-dropdown');
  if (!dd) return;
  try {
    const notifs = await api('/api/notifications');
    if (notifs.length === 0) {
      dd.innerHTML = `<p style="color:var(--fg3);font-size:.85rem;text-align:center;padding:20px">${t('noNotifications')}</p>`;
      return;
    }
    let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:600;font-size:.9rem">${t('notifications')}</span>
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()">${t('markAllRead')}</button>
    </div>`;
    for (const n of notifs) {
      html += `<div class="notif-item ${n.is_read?'':'unread'}" onclick="readNotification(${n.id}, ${n.task_id || 'null'}, '${esc(n.type||'')}')">
        <div><span class="notif-icon">${notifIcon(n.type)}</span> ${esc(n.text)}</div>
        <div class="notif-time">${fmtDate(n.created_at)}</div>
      </div>`;
    }
    dd.innerHTML = html;
  } catch(e) { dd.innerHTML = `<p style="color:var(--red)">${t('error')}</p>`; }
}

// notifIcon picks an emoji per notification type so the feed scans by service.
function notifIcon(type) {
  type = type || '';
  if (type.indexOf('chat') === 0) return '&#128172;';
  if (type.indexOf('calendar') === 0) return '&#128197;';
  if (type === 'mail') return '&#9993;';
  return '&#9678;'; // kanban (mention/assigned/comment/subscribed)
}

// notifRoute maps a notification to the view it should open (service routes only
// when that service is enabled), or null to just refresh the feed in place.
function notifRoute(type, taskId) {
  type = type || '';
  if (type.indexOf('chat') === 0 && isServiceEnabled('chat')) return '/chat';
  if (type.indexOf('calendar') === 0 && isServiceEnabled('calendar')) return '/calendar';
  if (type === 'mail' && isServiceEnabled('mail')) return '/mail';
  if (taskId) return '/task/' + taskId;
  return null;
}

async function readNotification(id, taskId, type) {
  try { await api('/api/notifications/read', 'POST', { id }); } catch {}
  const route = notifRoute(type, taskId);
  if (route) { toggleNotifications(); navigateTo(route); }
  else { loadNotifications(); }
  refreshNotifCount();
}

async function markAllRead() {
  try { await api('/api/notifications/read-all', 'POST'); loadNotifications(); refreshNotifCount(); } catch {}
}

async function refreshNotifCount() {
  try {
    const me = await api('/api/auth/me');
    currentUser = me;
    const nb = document.getElementById('notif-count');
    if (nb) {
      if (me.unread > 0) { nb.textContent = me.unread; nb.classList.remove('hidden'); }
      else { nb.classList.add('hidden'); }
    }
  } catch {}
}

function pollNotifications() {
  setInterval(refreshNotifCount, NOTIF_POLL_MS);
}

// Close notif dropdown on outside click
document.addEventListener('click', function(e) {
  if (notifOpen && !e.target.closest('#notif-dropdown') && !e.target.closest('#notif-btn')) {
    notifOpen = false;
    const dd = document.getElementById('notif-dropdown');
    if (dd) dd.classList.add('hidden');
  }
});

// === Global cross-service search (command palette) ===
function openGlobalSearch() {
  if (document.getElementById('gsearch-ov')) return;
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'gsearch-ov';
  ov.innerHTML = `<div class="modal gsearch-modal">
    <input id="gsearch-input" class="gsearch-input" placeholder="${t('search')}" autocomplete="off">
    <div id="gsearch-results" class="gsearch-results"></div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  const inp = ov.querySelector('#gsearch-input');
  inp.focus();
  let tmo = null;
  inp.addEventListener('input', () => { clearTimeout(tmo); tmo = setTimeout(() => gsearchRun(inp.value), 250); });
  inp.addEventListener('keydown', e => { if (e.key === 'Escape') ov.remove(); });
}
async function gsearchRun(q) {
  const box = document.getElementById('gsearch-results');
  if (!box) return;
  q = q.trim();
  if (!q) { box.innerHTML = ''; return; }
  let hits = [];
  try { hits = await api('/api/search/global?q=' + encodeURIComponent(q)); } catch (e) { box.innerHTML = ''; return; }
  if (!hits.length) { box.innerHTML = `<div class="gsearch-empty">${t('notFound')}</div>`; return; }
  box.innerHTML = hits.map(h => `<div class="gsearch-hit" onclick="gsearchGo('${escAttr(h.url)}')">
    <span class="gsearch-svc">${SERVICE_ICONS[h.service] || ''}</span>
    <span class="gsearch-main"><b>${esc(h.title)}</b>${h.snippet ? ` <span class="gsearch-snip">${esc(h.snippet)}</span>` : ''}</span>
  </div>`).join('');
}
function gsearchGo(url) {
  const ov = document.getElementById('gsearch-ov');
  if (ov) ov.remove();
  navigateTo(url);
}

// === Search ===
// Unified cross-service search. The scope dropdown limits results to one service
// (default = the current service); empty scope searches everything.
function serviceForView(v) {
  if (['board', 'task', 'epic', 'sprint', 'backlog', 'user'].includes(v)) return 'kanban';
  if (['wiki', 'chat', 'calendar', 'mail'].includes(v)) return v;
  return '';
}
function updateSearchScope() {
  const sel = document.getElementById('search-scope');
  if (!sel) return;
  const allLabel = (currentLang === 'ru') ? 'Везде' : 'All';
  // kanban is part of `services` now, so don't add it separately (avoids a duplicate).
  const opts = [['', allLabel]];
  for (const s of services.filter(s => s.enabled)) opts.push([s.name, t('svc_' + s.name)]);
  const cur = serviceForView(currentView);
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('');
  sel.value = opts.some(o => o[0] === cur) ? cur : '';
}
function onSearchScopeChange() {
  const s = document.getElementById('search');
  if (s && s.value.trim()) doSearch(s.value);
}
function searchGo(url) {
  const r = document.getElementById('search-results'); if (r) r.classList.add('hidden');
  const s = document.getElementById('search'); if (s) s.value = '';
  navigateTo(url);
}
async function doSearch(query) {
  const q = query.trim();
  const resultsEl = document.getElementById('search-results');
  if (!q) { if (resultsEl) { resultsEl.classList.add('hidden'); resultsEl.innerHTML = ''; } return; }
  const scopeEl = document.getElementById('search-scope');
  const scope = scopeEl ? scopeEl.value : '';
  try {
    const hits = await api('/api/search/global?q=' + encodeURIComponent(q) + (scope ? '&scope=' + encodeURIComponent(scope) : ''));
    if (!resultsEl) return;
    if (!hits.length) {
      resultsEl.innerHTML = `<p style="color:var(--fg3)">${t('nothingFound')}</p>`;
    } else {
      resultsEl.innerHTML = hits.map(h => `<div class="search-result-item" onclick="searchGo('${escAttr(h.url)}')">
        <span class="gsearch-svc">${SERVICE_ICONS[h.service] || ''}</span>
        <span><b>${esc(h.title)}</b>${h.snippet ? ` <span style="color:var(--fg3)">${esc(h.snippet)}</span>` : ''}</span>
      </div>`).join('');
    }
    resultsEl.classList.remove('hidden');
  } catch (e) { /* ignore */ }
}

// Close search results on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('#search') && !e.target.closest('#search-results')) {
    const r = document.getElementById('search-results');
    if (r) r.classList.add('hidden');
  }
});

// llmGenerateTaskFields asks the LLM to draft a description + TODO from the title
// (plus optional notes) and fills the form fields.
async function llmGenerateTaskFields() {
  const title = (document.getElementById('task-title').value || '').trim();
  if (!title) { alert(t('titleRequired') || 'Title required'); return; }
  const btn = document.getElementById('task-llm-btn');
  const notes = (document.getElementById('task-desc').value || '').trim();
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  try {
    const r = await api('/api/llm/generate-task', 'POST', { title, prompt: notes });
    // Don't overwrite the user's fields — show the draft so it can be compared,
    // copied, or applied (replace / append) deliberately.
    showLlmDraft(r.description || '', r.todo || '');
  } catch (e) { alert(e.message); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = '✨ ' + t('llmGenerate'); } }
}

// showLlmDraft renders the generated description/TODO as a read-only draft panel
// under the fields, with per-block Replace / Append / Copy actions.
function showLlmDraft(desc, todo) {
  const panel = document.getElementById('task-llm-result');
  if (!panel) return;
  const block = (key, text, targetId) => {
    if (!text) return '';
    return `<div class="llm-draft-block">
      <div class="llm-draft-head">
        <span>${esc(t(key))}</span>
        <span class="llm-draft-actions">
          <button type="button" class="btn btn-ghost btn-sm" data-act="replace" data-target="${targetId}">${esc(t('llmReplace'))}</button>
          <button type="button" class="btn btn-ghost btn-sm" data-act="append" data-target="${targetId}">${esc(t('llmAppend'))}</button>
          <button type="button" class="btn btn-ghost btn-sm" data-act="copy">${esc(t('llmCopy'))}</button>
        </span>
      </div>
      <textarea class="llm-draft-text" rows="${Math.min(10, Math.max(3, text.split('\n').length))}" readonly>${esc(text)}</textarea>
    </div>`;
  };
  panel.innerHTML = `<div class="llm-draft-bar">
      <span class="llm-draft-title">&#10024; ${esc(t('llmGenDraft'))}</span>
      <button type="button" class="btn btn-ghost btn-sm" onclick="hideLlmDraft()">${esc(t('llmHideDraft'))}</button>
    </div>
    ${block('description', desc, 'task-desc')}
    ${block('todo', todo, 'task-todo')}`;
  panel.style.display = '';
  panel.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const ta = b.closest('.llm-draft-block').querySelector('.llm-draft-text');
    const text = ta.value;
    const act = b.dataset.act;
    if (act === 'copy') {
      navigator.clipboard?.writeText(text).then(() => { const o = b.textContent; b.textContent = '✓'; setTimeout(() => b.textContent = o, 1200); });
      return;
    }
    const target = document.getElementById(b.dataset.target);
    if (!target) return;
    if (act === 'replace') target.value = text;
    else target.value = target.value.trim() ? (target.value.trim() + '\n' + text) : text;
    target.dispatchEvent(new Event('input'));
  }));
}

function hideLlmDraft() {
  const panel = document.getElementById('task-llm-result');
  if (panel) { panel.style.display = 'none'; panel.innerHTML = ''; }
}

function filterDepList(query) {
  const items = document.querySelectorAll('#dep-list .dep-list-item');
  const q = query.toLowerCase();
  items.forEach(item => {
    const title = item.dataset.title || '';
    const text = item.textContent.toLowerCase();
    item.style.display = (!q || title.includes(q) || text.includes(q)) ? '' : 'none';
  });
}

function toggleDep(id, checked) {
  const container = document.getElementById('dep-selected');
  if (!container) return;
  if (checked) {
    const task = state.tasks.find(t => t.id === id);
    const chip = document.createElement('span');
    chip.className = 'dep-chip';
    chip.dataset.depId = id;
    chip.innerHTML = `#${id} ${task ? esc(task.title) : ''}<button onclick="removeDepChip(${id})">&#10005;</button>`;
    container.appendChild(chip);
  } else {
    const chip = container.querySelector(`[data-dep-id="${id}"]`);
    if (chip) chip.remove();
  }
}

function removeDepChip(id) {
  const chip = document.querySelector(`#dep-selected [data-dep-id="${id}"]`);
  if (chip) chip.remove();
  const cb = document.querySelector(`#dep-list input[value="${id}"]`);
  if (cb) cb.checked = false;
}

async function saveTask(taskId, btn) {
  btn.disabled = true;
  const title = document.getElementById('task-title').value.trim();
  const colId = parseInt(document.getElementById('task-col').value);
  const priority = parseInt(document.getElementById('task-prio').value);
  const epicVal = document.getElementById('task-epic').value;
  const sprintVal = document.getElementById('task-sprint').value;
  const assigneeVal = document.getElementById('task-assignee').value;
  const desc = document.getElementById('task-desc').value;
  const todo = document.getElementById('task-todo').value;
  const url = document.getElementById('task-url').value.trim();
  let deadlineVal = document.getElementById('task-deadline').value;
  // If only date without time, default to 12:00 in user's timezone
  if (deadlineVal && deadlineVal.length === 10) {
    deadlineVal = deadlineVal + 'T12:00';
  }
  const tagIds = Array.from(document.querySelectorAll('.chip.selected[data-tag-id]')).map(el => parseInt(el.dataset.tagId));
  const depIds = Array.from(document.querySelectorAll('#dep-selected .dep-chip')).map(el => parseInt(el.dataset.depId));

  if (!title || !colId) { btn.disabled = false; alert(t('error')); return; }

  const body = {
    title, description: desc, todo, project_url: url, column_id: colId,
    epic_id: epicVal ? parseInt(epicVal) : null,
    sprint_id: sprintVal ? parseInt(sprintVal) : null,
    assignee_id: assigneeVal ? parseInt(assigneeVal) : null,
    priority, tag_ids: tagIds, depends_on_ids: depIds,
    deadline: deadlineVal || ''
  };

  try {
    if (taskId) {
      await api('/api/tasks/' + taskId, 'PUT', body);
    } else {
      const res = await api('/api/tasks', 'POST', body);
      taskId = res.id;
    }
    document.querySelector('.modal-overlay').remove();
    await loadBoard();
    if (currentView === 'task') renderTaskPage(taskId);
    else renderBoard();
  } catch(e) { btn.disabled = false; alert(t('error') + ': ' + e.message); }
}

async function deleteTask(taskId) {
  if (isReadonly()) return;
  if (!await uiConfirm(t('deleteConfirm'))) return;
  try {
    await api('/api/tasks/' + taskId, 'DELETE');
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.remove();
    await loadBoard();
    navigateTo('/');
  } catch(e) { alert(t('error')); }
}

async function renameColumn(id, oldName) {

  if (!name || name === oldName) return;
  try { await api('/api/columns/' + id, 'PUT', { Name: name }); await loadBoard(); } catch(e) { alert(t('error')); }

function isProtectedColumn(id) {
  if (state.columns.length < 2) return true;
  return id === state.columns[0].id || id === state.columns[state.columns.length - 1].id;
}
async function deleteColumn(id) {
  if (isProtectedColumn(id)) { alert(t('protectedColumn')); return; }
  const colTasks = state.tasks.filter(t => t.column_id === id);
  if (colTasks.length > 0) { alert(t('moveTasksFirst')); return; }
  if (!await uiConfirm(t('confirmDeleteCol') + '?')) return;
  try { await api('/api/columns/' + id, 'DELETE'); await loadBoard(); } catch(e) { alert(t('error')); }
}
async function moveColumnOrder(index, dir) {
  const ids = state.columns.map(c => c.id);
  const swapIdx = index + dir;
  if (swapIdx < 0 || swapIdx >= ids.length) return;
  [ids[index], ids[swapIdx]] = [ids[swapIdx], ids[index]];
  try { await api('/api/columns/reorder', 'POST', { ids }); await loadBoard(); } catch(e) { alert(t('error')); }
}

async function renderSprintPage(sprintId) {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="epic-page"><p>Loading...</p></div>';
  let data;
  try { data = await api('/api/sprints/' + sprintId); } catch { app.innerHTML = `<div class="epic-page"><p>${t('notFound')}</p><a href="/" onclick="navigateTo('/');return false;">${t('backToBoard')}</a></div>`; return; }
  const sprint = data.sprint;
  const tasks = data.tasks || [];
  const firstCol = state.columns.length ? state.columns[0] : null;
  const lastCol = state.columns.length ? state.columns[state.columns.length-1] : null;
  const doneCount = lastCol ? tasks.filter(t => t.column_id === lastCol.id).length : 0;
  const pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;

  const activeTasks = tasks.filter(t => {
    if (firstCol && t.column_id === firstCol.id) return false;
    if (lastCol && t.column_id === lastCol.id) return false;
    return true;
  });
  const backlogTasks = firstCol ? tasks.filter(t => t.column_id === firstCol.id) : [];
  const doneTasks = lastCol ? tasks.filter(t => t.column_id === lastCol.id) : [];

  const statusLabels = {planning: t('sprintPlanning'), active: t('sprintActive'), completed: t('sprintCompleted')};
  const statusColors = {planning: 'var(--fg3)', active: 'var(--green)', completed: 'var(--blue)'};
  const prioColors = ['','var(--blue)','var(--green)','var(--orange)','var(--red)'];

  let sprintSortMode = localStorage.getItem('kanban-sprint-sort') || 'position';
  let sprintBacklogSort = localStorage.getItem('kanban-sprint-backlog-sort') || 'position';
  let sprintDoneSort = localStorage.getItem('kanban-sprint-done-sort') || 'position';

  function renderSprintSortSelect(storageKey, currentMode) {
    return `<select onchange="localStorage.setItem('${storageKey}',this.value);renderSprintPage(${sprintId})" style="background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:4px 8px;color:var(--fg);font-size:.82rem">
      <option value="position" ${currentMode==='position'?'selected':''}>${t('sortPosition')}</option>
      <option value="priority" ${currentMode==='priority'?'selected':''}>${t('sortPriority')}</option>
      <option value="date" ${currentMode==='date'?'selected':''}>${t('sortDate')}</option>
      <option value="title" ${currentMode==='title'?'selected':''}>${t('sortTitle')}</option>
    </select>`;
  }

  function renderSprintTaskRow(task) {
    const colName = state.columns.find(c => c.id === task.column_id);
    let colSelect = '';
    if (!isReadonly() && state.columns.length > 1) {
      const opts = state.columns.map(c => `<option value="${c.id}" ${c.id === task.column_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
      colSelect = `<select class="epic-task-col-select" onclick="event.stopPropagation()" onchange="event.stopPropagation();moveSprintTask(${task.id},+this.value,${sprintId})" style="background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:2px 6px;color:var(--fg);font-size:.78rem;cursor:pointer">${opts}</select>`;
    }
    return `<div class="epic-task-row" onclick="navigateTo('/task/${task.id}')">
      <span class="card-id">${taskRef(task)}</span>
      <span class="epic-task-title">${esc(task.title)}</span>
      ${task.priority > 0 ? `<span class="epic-task-prio" style="color:${prioColors[task.priority]}">P${task.priority}</span>` : ''}
      ${colSelect || `<span class="epic-task-status">${colName ? esc(colName.name) : ''}</span>`}
    </div>`;
  }

  let html = `<div class="epic-page">
    <div class="epic-page-header">
      <h2>&#127947; ${esc(sprint.name)}</h2>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="color:${statusColors[sprint.status]||'var(--fg3)'};font-size:.85rem;font-weight:600">${statusLabels[sprint.status]||sprint.status}</span>
        ${sprint.start_date ? `<span style="font-size:.78rem;color:var(--fg3)">${sprint.start_date.replace(/-/g,'/')} &ndash; ${sprint.end_date.replace(/-/g,'/')}</span>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="navigateTo('/')">${t('back')}</button>
        ${!isReadonly() ? `<button class="btn btn-ghost btn-sm" onclick="showEditSprint(${sprint.id})">${t('editSprint')}</button>` : ''}
        ${!isReadonly() && sprint.status === 'planning' ? `<button class="btn btn-primary btn-sm" onclick="startSprint(${sprint.id})">${t('startSprint')}</button>` : ''}
        ${!isReadonly() && sprint.status === 'active' ? `<button class="btn btn-primary btn-sm" onclick="showCompleteSprint(${sprint.id})">${t('completeSprint')}</button>` : ''}
      </div>
    </div>
    <div class="epic-progress" style="margin-bottom:16px">
      <span class="epic-progress-text">${doneCount}/${tasks.length} ${t('tasksCompleted')} (${pct}%)</span>
      <div class="epic-progress-bar"><div class="epic-progress-fill" style="width:${pct}%;background:var(--accent)"></div></div>
    </div>`;

  // Active tasks
  html += `<div style="margin-bottom:8px;display:flex;gap:6px;align-items:center;justify-content:space-between">
      <h3 style="margin:0">${t('active')} (${activeTasks.length})</h3>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:.78rem;color:var(--fg3)">${t('sortBy')}:</span>
        ${renderSprintSortSelect('kanban-sprint-sort', sprintSortMode)}
      </div>
    </div>
    <div class="epic-task-list">`;
  const sortedActive = sortEpicTasks(activeTasks, sprintSortMode);
  for (const task of sortedActive) html += renderSprintTaskRow(task);
  if (!activeTasks.length) html += `<p style="color:var(--fg3)">${t('noActiveTasks')}</p>`;
  html += '</div>';

  if (backlogTasks.length) {
    const sortedBacklog = sortEpicTasks(backlogTasks, sprintBacklogSort);
    html += `<div class="task-page-section" style="margin-top:16px;opacity:.7">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0">${t('backlog')} (${backlogTasks.length})</h3>
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-size:.78rem;color:var(--fg3)">${t('sortBy')}:</span>
          ${renderSprintSortSelect('kanban-sprint-backlog-sort', sprintBacklogSort)}
        </div>
      </div>
      <div class="epic-task-list">${sortedBacklog.map(renderSprintTaskRow).join('')}</div>
    </div>`;
  }
  if (doneTasks.length) {
    const sortedDone = sortEpicTasks(doneTasks, sprintDoneSort);
    html += `<div class="task-page-section" style="margin-top:16px;opacity:.5">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0">${t('done')} (${doneTasks.length})</h3>
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-size:.78rem;color:var(--fg3)">${t('sortBy')}:</span>
          ${renderSprintSortSelect('kanban-sprint-done-sort', sprintDoneSort)}
        </div>
      </div>
      <div class="epic-task-list">${sortedDone.map(renderSprintTaskRow).join('')}</div>
    </div>`;
  }
  html += '</div>';
  app.innerHTML = html;
}
