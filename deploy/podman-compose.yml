# Preconfigured podman-compose: the kanban app on its PostgreSQL backend, plus
# a Postgres server — reachable from the LAN through a browser.
#
# All published ports live in the reserved 10010-10020 range (see .env).
#
#   cd deploy
#   podman-compose up -d --build
#   # then open http://<THIS-HOST-LAN-IP>:10010  (first visit = create admin)
#
#   podman-compose logs -f app        # follow app logs
#   podman-compose down               # stop (keeps data volumes)
#   podman-compose down -v            # stop and WIPE the database + backups
#
# The app image is the repo's Containerfile; we only override its command to
# point at Postgres instead of the default SQLite file.

# Project name (prefix for containers/volumes/network). Defaults to "madokworks"
# so the names don't depend on this folder's name; override with the
# COMPOSE_PROJECT_NAME env var (or `podman-compose -p <name>`).
name: ${COMPOSE_PROJECT_NAME:-madokworks}

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-kanban}
      POSTGRES_PASSWORD: ${PGPASSWORD:-kanban}
      POSTGRES_DB: ${PGDATABASE:-kanban}
    volumes:
      - kanban-pgdata:/var/lib/postgresql/data
    # Postgres is NOT published to the host by default — the app reaches it over
    # the internal network (db:5432), and not publishing it avoids port clashes
    # between instances. To expose it for direct psql/clients, run the app via
    # kanban.sh with --db-port (which adds the mapping), or add a ports: entry here.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-kanban} -d ${PGDATABASE:-kanban}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Containerfile
      args:
        # Build without the (large) draw.io download when the network to GitHub
        # releases is unreliable: SKIP_DRAWIO=1 ./kanban.sh build
        SKIP_DRAWIO: "${SKIP_DRAWIO:-0}"
        DRAWIO_VERSION: "${DRAWIO_VERSION:-v30.0.4}"
    # Start on SQLite so the first-run setup page shows the "use external
    # PostgreSQL" chooser. Point it at the bundled db service with:
    #   host: db   port: 5432   database/user/password: see .env (kanban/kanban)
    # The choice is saved to /data/db.json and the app restarts onto Postgres.
    #
    # To skip the chooser and force Postgres from the start instead, replace the
    # command below with the -db URL form:
    #   - "-db"
    #   - "postgres://${PGUSER:-kanban}:${PGPASSWORD:-kanban}@db:5432/${PGDATABASE:-kanban}?sslmode=disable"
    command:
      - "-addr"
      - ":8080"
      # APP_DB defaults to the SQLite file (first-run setup then offers the
      # "use external PostgreSQL" chooser). Set APP_DB to a postgres://… URL to
      # force Postgres from the start and skip the chooser.
      - "-db"
      - "${APP_DB:-/data/kanban.db}"
      - "-data-dir"
      - "/data"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Browser: http://<THIS-HOST-LAN-IP>:10010 . Bind to 127.0.0.1 (APP_BIND)
      # to restrict access to this host (e.g. behind a reverse proxy).
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-10010}:8080"
    volumes:
      # Backups (auto + manual) land here.
      - kanban-appdata:/data
    # The image's built-in HEALTHCHECK starts a second server process; disable it
    # here. Liveness is covered by restart + the DB healthcheck dependency.
    healthcheck:
      test: ["NONE"]
    restart: unless-stopped

volumes:
  kanban-pgdata:
  kanban-appdata:
